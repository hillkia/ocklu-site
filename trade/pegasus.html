<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PEGASUS Eksekusi</title>
<meta name="description" content="PEGASUS — lapis eksekusi ocklu-trade: posisi, Rumus OCKLU, keputusan, riwayat order, ledger.">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="pegasus.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f4f6fa;--panel:#fff;--panel2:#e9eef6;--line:#d9e0ec;--tx:#111827;--mut:#56627a;
  --up:#15803d;--down:#dc2626;--warn:#b45309;--acc:#0369a1;--chip:#e6ecf6;--shade:rgba(15,23,42,.45);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e14;--panel:#131824;--panel2:#1a2130;--line:#26304a;--tx:#e8edf7;--mut:#8b97ac;
  --up:#4ade80;--down:#f87171;--warn:#fbbf24;--acc:#38bdf8;--chip:#1f2940;--shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0e14;--panel:#131824;--panel2:#1a2130;--line:#26304a;--tx:#e8edf7;--mut:#8b97ac;
  --up:#4ade80;--down:#f87171;--warn:#fbbf24;--acc:#38bdf8;--chip:#1f2940;--shade:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-inline:16px;padding-block:0 32px;max-width:720px;margin:0 auto;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
header{padding-block:14px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;letter-spacing:.5px}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;background:var(--chip);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;min-height:40px;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* tab di ATAS & menempel — bilah bawah sering tertutup bilah aplikasi/browser di HP */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px 10px}
nav .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel2);border-radius:12px;padding:4px}
nav button{background:none;border:0;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut);min-height:44px;
  touch-action:manipulation}
nav button[aria-selected="true"]{color:var(--tx);background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:999px;
  background:var(--chip);color:var(--mut);white-space:nowrap}
.chip.paper{color:var(--warn)}.chip.live{color:var(--down)}.chip.testnet{color:var(--acc)}
.chip.ok{color:var(--up)}.chip.bad{color:var(--down)}
.banner{border:1px solid var(--down);color:var(--down);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.hint{font-size:12px;color:var(--mut);margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:8px;border-radius:10px;background:var(--panel2)}
.stat .k{font-size:12px;color:var(--mut)}
.stat .v{font-size:21px;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.list>*+*{border-top:1px solid var(--line)}
.item{padding:10px 4px}
.t{font-weight:600}
.small{font-size:12px;color:var(--mut)}
.reasons{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.reasons .chip{white-space:normal}
/* semua yang bisa diketuk */
[data-i]{cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border-radius:10px}
[data-i]:hover{background:color-mix(in srgb,var(--acc) 7%,transparent)}
[data-i]:active{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.item[data-i]::after,.pos[data-i]::after{content:"›";position:absolute;right:4px;top:10px;color:var(--mut);font-size:18px}
.pos-top{display:flex;align-items:baseline;gap:8px;padding-right:14px}
.pos-top .pnl{margin-left:auto;font-size:20px;font-weight:700}
.rail{position:relative;height:8px;border-radius:99px;margin:14px 0 6px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--down) 55%,transparent),var(--panel2) 40%,color-mix(in srgb,var(--up) 55%,transparent))}
.rail .entry{position:absolute;top:-4px;width:2px;height:16px;background:var(--mut)}
.rail .now{position:absolute;top:-5px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--tx);border:3px solid var(--panel)}
.rail-lbl{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--mut)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
section[hidden]{display:none}
ol.pagar{padding-left:0;list-style:none}
ol.pagar li{font-size:13px;padding:8px 4px}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.foot{color:var(--mut);font-size:11px;text-align:center;margin:18px 0 6px}
/* lembar info */
#sheet{position:fixed;inset:0;z-index:2147483001;display:flex;align-items:flex-end;justify-content:center;background:var(--shade)}
#sheet[hidden]{display:none}
#sheet .box{background:var(--panel);width:100%;max-width:720px;max-height:82%;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
#sheet h3{font-size:18px;margin-bottom:4px;text-wrap:balance}
#sheet .sub{font-size:13px;color:var(--mut);margin-bottom:12px}
#sheet dl{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:6px 12px;font-size:14px;margin-bottom:12px}
#sheet dt{color:var(--mut)}
#sheet dd{text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:break-word;min-width:0}
#sheet dd.hash{word-break:break-all;font-size:12px}
#sheet p{font-size:14px;margin-bottom:10px}
#sheet .tutup{width:100%;margin-top:6px;min-height:46px;font-weight:600}
@media (prefers-reduced-motion:no-preference){#sheet .box{animation:naik .18s ease-out}.card{animation:in .2s ease-out both}}
@keyframes naik{from{transform:translateY(24px);opacity:.6}}
@keyframes in{from{opacity:.4;transform:translateY(3px)}}
</style>
</head>
<body>
<header>
  <div class="grow">
    <h1>🪽 PEGASUS</h1>
    <div class="small" id="sub" data-i="jadwal" role="button" tabindex="0">memuat…</div>
  </div>
  <button id="muat" type="button" aria-label="Muat ulang data">↻</button>
</header>

<nav><div class="in" role="tablist" aria-label="Bagian dasbor">
  <button type="button" role="tab" data-t="ringkas" aria-selected="true">Ringkas</button>
  <button type="button" role="tab" data-t="posisi" aria-selected="false">Posisi</button>
  <button type="button" role="tab" data-t="sinyal" aria-selected="false">Sinyal</button>
  <button type="button" role="tab" data-t="riwayat" aria-selected="false">Riwayat</button>
</div></nav>

<div id="banner"></div>
<p class="hint">Ketuk kartu, angka, baris, atau chip mana pun untuk melihat detail dan artinya.</p>

<main>
  <section id="t-ringkas" role="tabpanel"></section>
  <section id="t-posisi" role="tabpanel" hidden></section>
  <section id="t-sinyal" role="tabpanel" hidden></section>
  <section id="t-riwayat" role="tabpanel" hidden></section>
</main>
<p class="foot" id="foot">Alat bantu berpikir — tak ada alat yang bisa memastikan pasar.<br>
  Pagar membatasi rugi, bukan menjamin untung. · <a href="./" style="color:var(--acc)">dasbor verdict</a></p>

<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-j">
  <div class="box"><div class="grab"></div>
    <h3 id="sheet-j"></h3><div class="sub" id="sheet-s"></div>
    <div id="sheet-isi"></div>
    <button type="button" class="tutup" id="sheet-x">Tutup</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (v, d = 2) => v == null || isNaN(v) ? "—" : `${v > 0 ? "+" : ""}${Number(v).toFixed(d)}%`;
const cls = v => v == null ? "mut" : v > 0 ? "up" : v < 0 ? "down" : "mut";
const angka = (v, q) => {
  if (v == null || isNaN(v)) return "—";
  const d = q === "idr" ? 0 : Math.abs(v) < 1 ? 6 : Math.abs(v) < 100 ? 4 : 2;
  return (q === "idr" ? "Rp " : "") + Number(v).toLocaleString("id-ID", {maximumFractionDigits: d}) + (q && q !== "idr" ? " " + q : "");
};
const lalu = iso => {
  if (!iso) return "—";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "barusan" : m < 60 ? `${m} mnt lalu` : m < 1440 ? `${Math.round(m / 60)} jam lalu` : `${Math.round(m / 1440)} hari lalu`;
};
const waktu = iso => iso ? new Date(iso).toLocaleString("id-ID", {dateStyle: "medium", timeStyle: "short"}) : "—";
const koin = s => (s || "").replace("_USDT", "");

/* ---------- lembar info: setiap elemen bisa diketuk ---------- */
let INFO = [];
function i(judul, isi) {           // daftarkan info → atribut untuk elemen yang bisa diketuk
  INFO.push({judul, ...isi});
  return `data-i="${INFO.length - 1}" role="button" tabindex="0"`;
}
const STATIS = {
  jadwal: {judul: "Kapan data diperbarui", teks: [
    "Siklus penuh tiap 4 jam (00:05, 04:05, 08:05, 12:05, 16:05, 20:05 WIB): ambil harga → analisa 6 mesin → Rumus OCKLU → PEGASUS jaga & masuk → terbit ke sini.",
    "Tiap 5 menit PEGASUS menjaga stop dan target. Kalau ada jual-beli, halaman ini ikut terbit ulang.",
    "Halaman memuat ulang data sendiri tiap 1 menit, atau ketuk ↻."]}
};
function buka(n) {
  const x = STATIS[n] || INFO[+n];
  if (!x) return;
  $("#sheet-j").textContent = x.judul;
  $("#sheet-s").textContent = x.sub || "";
  let h = "";
  const baris = (x.baris || []).filter(b => b[1] != null && b[1] !== "");
  if (baris.length) h += "<dl>" + baris.map(([k, v]) => `<dt>${esc(k)}</dt><dd${/^[0-9a-f]{40,}$/.test(String(v)) ? ' class="hash"' : ""}>${esc(v)}</dd>`).join("") + "</dl>";
  (x.teks || []).filter(Boolean).forEach(t => h += `<p>${esc(t)}</p>`);
  if (x.daftar && x.daftar.length) h += `<div class="reasons">${x.daftar.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>`;
  $("#sheet-isi").innerHTML = h;
  $("#sheet").hidden = false;
  $("#sheet .box").scrollTop = 0;
  $("#sheet-x").focus({preventScroll: true});
}
function tutup() { $("#sheet").hidden = true; }
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#sheet-x") || t.id === "sheet") return tutup();
  if (t.closest("#sheet .box")) return;
  const tab = t.closest("nav button[data-t]");
  if (tab) return pilihTab(tab.dataset.t);
  if (t.closest("#muat")) return muat();
  const el = t.closest("[data-i]");
  if (el) buka(el.dataset.i);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return tutup();
  const el = e.target.closest && e.target.closest("[data-i]");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); buka(el.dataset.i); }
});

/* ---------- makna ---------- */
const KUADRAN = {
  SODORKAN: ["ok", "SODORKAN", "Ada niat beli nyata DAN teknikal STRONG LONG. Satu-satunya kuadran yang boleh dieksekusi PEGASUS."],
  PANTAU: ["", "PANTAU", "Niat beli sudah muncul, tapi teknikal belum STRONG LONG. Permintaan datang duluan — tunggu barangnya siap."],
  TANPA_PEMBELI: ["", "TANPA PEMBELI", "Grafik bagus, tapi tak ada jejak orang yang mau beli. Ini pola lama yang gagal — ditolak."],
  HINDARI: ["bad", "HINDARI", "Niat JUAL (uang keluar, berita bahaya) atau niat PALSU (gorengan, sodok kilat, putar-putar, bolak-balik — ramai buatan bandar)."]
};
const KOMP = {cari: ["Dicari orang", "trending CoinGecko", 0.30], uang: ["Uang masuk", "putaran ramai + harga naik", 0.40],
  lonjak: ["Volume melonjak", "dibanding siklus lalu", 0.20], berita: ["Disebut di berita", "berita penting, bukan bahaya", 0.10]};
const MODE = {PAPER: "Harga asli Indodax, uang pura-pura. Isi INDODAX_KEY & INDODAX_SECRET di ~/shamar/.env → otomatis LIVE.",
  LIVE: "Order uang asli dikirim ke bursa.", TESTNET: "Order dikirim ke Binance testnet — uang palsu, mesin asli."};
const SEBAB = {STOP: "Harga turun menyentuh stop ALADIN.", TARGET: "Harga naik menyentuh target 2R.",
  WAKTU: "Posisi sudah 72 jam — ditutup supaya modal tak tertahan.", SINYAL_BALIK: "Verdict terbaru tak lagi LONG, atau STAND_ASIDE."};
const chipK = k => k && KUADRAN[k] ? `<span class="chip ${KUADRAN[k][0]}">${KUADRAN[k][1]}</span>` : "";
const chipMode = m => `<span class="chip ${esc((m || "").toLowerCase())}">${esc(m)}</span>`;
const komponenBaris = k => Object.entries(KOMP).map(([id, [n, ket, w]]) =>
  [`${n} (bobot ${w})`, k && k[id] != null ? `${(k[id] * 100).toFixed(0)}% — ${ket}` : "—"]);

/* ---------- tab: Ringkas ---------- */
function ringkas(D) {
  const aktif = D.bursa.filter(b => b.status === "aktif");
  let h = "";
  for (const b of aktif) {
    const rem = b.rem || [];
    h += `<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0" class="grow">${esc(b.nama)}</h2>
      <span ${i("Mode " + b.mode, {teks: [MODE[b.mode]]})}>${chipMode(b.mode)}</span></div>
      <div class="hero">
        <div class="stat" ${i("Modal", {sub: b.nama, baris: [["Modal total", D.publik ? "disembunyikan (halaman publik)" : angka(b.modal, b.quote)],
            ["Uang bebas", D.publik ? "disembunyikan" : angka(b.bebas, b.quote)], ["Mata uang", b.quote.toUpperCase()]],
            teks: ["Modal = uang bebas + nilai koin yang dipegang, dihitung pakai harga yang didapat kalau dijual sekarang."]})}>
          <div class="k">Modal</div><div class="v num">${D.publik ? '<span class="mut" style="font-size:14px;font-weight:500">🔒 disembunyikan</span>' : angka(b.modal, b.quote)}</div></div>
        <div class="stat" ${i("Untung-rugi hari ini", {baris: [["Hari ini", pct(b.pnl_hari_pct)], ["Rem harian", "berhenti masuk di -5%"]],
            teks: ["Dibanding modal saat hari (WIB) dimulai. Kalau menyentuh -5%, PEGASUS berhenti membuka posisi baru sampai besok; posisi yang ada tetap dijaga stop-nya."]})}>
          <div class="k">Hari ini</div><div class="v num ${cls(b.pnl_hari_pct)}">${pct(b.pnl_hari_pct)}</div></div>
        <div class="stat" ${i("Posisi terbuka", {baris: [["Terbuka", `${b.posisi.length} dari maks 5`]], daftar: b.posisi.map(p => `${p.pair} ${pct(p.pnl_pct)}`),
            teks: ["Maksimal 5 posisi per bursa dan 30% modal terpakai sekaligus. Buka tab Posisi untuk detail tiap posisi."]})}>
          <div class="k">Posisi terbuka</div><div class="v num">${b.posisi.length}<span class="mut" style="font-size:14px"> / 5</span></div></div>
        <div class="stat" ${i("Kalah beruntun", {baris: [["Sekarang", `${b.beruntun_kalah} kali`], ["Batas rem", "3 kali"]],
            teks: ["Kalau 3 posisi berturut-turut ditutup rugi, PEGASUS berhenti masuk. Sekali menang, hitungan kembali ke 0."]})}>
          <div class="k">Kalah beruntun</div><div class="v num ${b.beruntun_kalah >= 2 ? "down" : ""}">${b.beruntun_kalah}<span class="mut" style="font-size:14px"> / 3</span></div></div>
      </div>
      <div class="reasons" style="margin-top:12px">${rem.length ? rem.map(r => `<span class="chip bad" ${i("Rem aktif", {teks: [r, "Selama rem aktif, tak ada order beli baru. Posisi yang ada tetap dijaga."]})}>⛔ ${esc(r)}</span>`).join("")
        : `<span class="chip ok" ${i("Rem tidak aktif", {teks: ["Tak ada saklar STOP, rugi hari ini di atas -5%, dan belum kalah 3× beruntun — PEGASUS boleh membuka posisi baru kalau ada yang lolos semua pagar."]})}>✓ rem tidak aktif — boleh masuk</span>`}</div>
    </div>`;
  }
  const st = Object.entries(D.statistik || {});
  h += `<div class="card"><h2>Hasil posisi tertutup</h2>${st.length ? `<div class="list">${st.map(([k, s]) => `
    <div class="item" ${i("Hasil " + k, {baris: [["Ditutup", s.tutup], ["Menang", s.menang], ["Win rate", s.winrate + "%"], ["Rata-rata", pct(s.rata_pct)], ["Jumlah %", pct(s.jumlah_pct)]],
        teks: ["Dihitung dari order SELL di ledger. Dengan sedikit transaksi angka ini belum bermakna — butuh puluhan transaksi sebelum bisa menilai mesin."]})}>
      <div class="row" style="padding-right:14px"><div class="grow"><div class="t">${esc(k)}</div><div class="small">${s.tutup} ditutup · ${s.menang} menang</div></div>
      <div style="text-align:right"><div class="num ${cls(s.rata_pct)}" style="font-weight:700">${pct(s.rata_pct)}</div><div class="small">rata · win ${s.winrate}%</div></div></div></div>`).join("")}</div>`
    : '<p class="empty">Belum ada posisi yang ditutup.</p>'}</div>`;
  h += `<div class="card"><h2>Bursa</h2><div class="list">${D.bursa.map(b => `
    <div class="item" ${i("Bursa " + b.nama, {baris: [["Status", b.status], ["Mode", b.mode], ["Mata uang", (b.quote || "").toUpperCase()]],
        teks: [b.status === "aktif" ? MODE[b.mode] : b.catatan, b.nama === "binance" ? "Binance diblokir ISP rumah; harus dijalankan dari server luar (Singapore/Tokyo)." : ""]})}>
      <div class="row" style="padding-right:14px"><div class="grow"><div class="t">${esc(b.nama)}</div><div class="small">${esc(b.status === "aktif" ? (b.mode + " · " + b.posisi.length + " posisi") : b.catatan)}</div></div>
      <span class="chip ${b.status === "aktif" ? "ok" : b.status === "terhalang" ? "bad" : ""}">${esc(b.status)}</span></div></div>`).join("")}</div></div>`;
  h += `<div class="card"><h2>Ledger</h2><div class="item" ${i("Ledger hash-chain", {baris: [["Status", D.ledger.ok ? "rantai utuh" : "RANTAI PUTUS"], ["Baris", D.ledger.entries], ["Kepala", D.ledger.head + "…"]],
        teks: ["Setiap verdict & order ditulis ke buku yang hanya bisa ditambah. Tiap baris menyimpan hash baris sebelumnya — kalau satu angka diubah atau dihapus, rantainya putus dan ketahuan.",
          "Audit ulang di laptop: python3 ~/ocklu-trade/run.py --verify"]})}>
      <div class="row" style="padding-right:14px"><span class="chip ${D.ledger.ok ? "ok" : "bad"}">${D.ledger.ok ? "✓ rantai utuh" : "✗ RANTAI PUTUS"}</span>
      <span class="small num">${D.ledger.entries} baris · kepala ${esc(D.ledger.head)}…</span></div></div></div>`;
  h += `<div class="card"><h2>Pagar yang dipegang mesin</h2><ol class="pagar list">${D.pagar.map((p, n) => `<li ${i("Pagar " + (n + 1), {teks: [p, "Pagar ada di kode (eksekusi/pagar.py), bukan saran. Order yang melanggar satu pagar saja langsung ditolak."]})}>${esc(p)}</li>`).join("")}</ol></div>`;
  return h;
}

/* ---------- tab: Posisi ---------- */
function posisi(D) {
  let h = "", ada = false;
  for (const b of D.bursa.filter(b => b.status === "aktif")) {
    for (const p of b.posisi) {
      ada = true;
      const e = Math.max(0, Math.min(1, p.entry_rentang)) * 100, n = p.posisi_rentang * 100;
      const keStop = p.kini ? (p.stop / p.kini - 1) * 100 : null, keTarget = p.kini ? (p.target / p.kini - 1) * 100 : null;
      h += `<div class="card pos" ${i(p.pair, {sub: `${b.nama} · ${b.mode}`, baris: [
          ["Masuk", angka(p.entry, b.quote)], ["Kini", angka(p.kini, b.quote)], ["Untung-rugi", pct(p.pnl_pct)],
          ["Stop", angka(p.stop, b.quote)], ["Jarak ke stop", pct(keStop)], ["Target", angka(p.target, b.quote)], ["Jarak ke target", pct(keTarget)],
          ["Umur", `${p.jam} jam dari 72`], ["Conviction saat masuk", p.conviction], ["Modal", D.publik ? "disembunyikan" : angka(p.modal, b.quote)]],
          teks: ["Keluar otomatis kalau: menyentuh stop, menyentuh target (2× jarak stop), umur 72 jam, atau verdict berbalik. Kalau untung sudah 1× jarak stop, stop digeser ke harga masuk."]})}>
        <div class="pos-top"><span class="t" style="font-size:17px">${esc(p.pair)}</span>${chipMode(b.mode)}<span class="pnl num ${cls(p.pnl_pct)}">${pct(p.pnl_pct)}</span></div>
        <div class="small">${esc(b.nama)} · ${p.jam} jam dari 72 · conviction ${p.conviction ?? "—"}${!D.publik && p.modal ? " · " + angka(p.modal, b.quote) : ""}</div>
        <div class="rail" aria-label="Harga kini di ${Math.round(n)}% antara stop dan target"><span class="entry" style="left:${e}%"></span><span class="now" style="left:${n}%"></span></div>
        <div class="rail-lbl num"><span>stop ${angka(p.stop, b.quote)}</span><span>masuk ${angka(p.entry, b.quote)}</span><span>target ${angka(p.target, b.quote)}</span></div>
        <div class="small num" style="margin-top:6px">kini ${angka(p.kini, b.quote)}</div></div>`;
    }
  }
  if (!ada) h = '<div class="card"><p class="empty">Tak ada posisi terbuka. Mesin masuk hanya kalau semua pagar lolos.</p></div>';
  const kep = D.bursa.filter(b => b.status === "aktif").flatMap(b => (b.keputusan || []).map(k => ({...k, bursa: b.nama})));
  h += `<div class="card"><h2>Keputusan siklus terakhir</h2>${kep.length ? `<div class="list">${kep.map(k => `
    <div class="item" ${i(`${k.hasil} ${koin(k.symbol)}`, {sub: k.bursa, baris: [["Keputusan", k.hasil], ["Conviction", k.conviction]], daftar: k.alasan,
        teks: [k.hasil === "BELI" ? "Lolos semua pagar dan Rumus OCKLU — order dikirim & dicatat di ledger." : "Ditolak karena alasan di bawah. Satu alasan saja sudah cukup untuk menolak."]})}>
      <div class="row" style="padding-right:14px"><span class="t grow">${esc(koin(k.symbol))}</span><span class="small">${esc(k.bursa)}</span>
      <span class="chip ${k.hasil === "BELI" ? "ok" : ""}">${esc(k.hasil)}</span></div>
      <div class="reasons">${k.alasan.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div></div>`).join("")}</div>`
    : '<p class="empty">Tak ada kandidat STRONG di siklus terakhir.</p>'}</div>`;
  return h;
}

/* ---------- tab: Sinyal ---------- */
function ocklu(D) {
  const O = D.ocklu;
  const tentang = i("Rumus OCKLU", {sub: "niat dulu, baru barang", teks: [
    "Rumus asli Ocklu (21/9): jangan bikin produk lalu berharap ada yang butuh — tangkap dulu NIAT orang, baru sodorkan jawabannya.",
    "Di pasar: NIAT = jejak orang mau beli (dicari, uang masuk, volume melonjak, disebut berita). BARANG = sinyal teknikal STRONG LONG dari 6 mesin.",
    "Skor niat 0–1, ambang 0,35. Hanya SODORKAN yang boleh dieksekusi PEGASUS.",
    "Jujur soal batas: ini jejak di data publik, bukan isi kepala pembeli. Menyaring, bukan meramal."]});
  if (!O) return `<div class="card"><h2 ${tentang}>Rumus OCKLU ⓘ</h2><p class="empty">Belum dihitung di verdict ini — tunggu siklus berikutnya.</p></div>`;
  return `<div class="card"><h2 ${tentang}>Rumus OCKLU · niat dulu, baru barang ⓘ</h2>
    <div class="hero" style="margin-bottom:8px">${Object.keys(KUADRAN).map(k => `
      <div class="stat" ${i(KUADRAN[k][1], {sub: `${(O[k] || []).length} koin`, teks: [KUADRAN[k][2]], daftar: (O[k] || []).map(x => `${koin(x.symbol)} · niat ${Number(x.skor_niat).toFixed(2)}`)})}>
        <div class="k">${KUADRAN[k][1]}</div><div class="v num ${k === "SODORKAN" ? "up" : k === "HINDARI" ? "down" : ""}">${(O[k] || []).length}</div></div>`).join("")}</div>
    <p class="small">Semua koin yang dipindai ikut dihitung. Ketuk angka untuk melihat daftarnya.</p>
    ${["SODORKAN", "PANTAU"].map(k => (O[k] || []).length ? `<div class="list" style="margin-top:8px">${O[k].slice(0, 8).map(x => `
      <div class="item" ${i(`${koin(x.symbol)} — ${KUADRAN[k][1]}`, {sub: x.nama || "", baris: [["Skor niat", `${Number(x.skor_niat).toFixed(3)} (ambang 0,35)`], ...komponenBaris(x.komponen),
          ["Teknikal", `${x.label || "—"} ${x.direction || ""}`], ["Conviction", x.conviction]], daftar: x.alasan, teks: [KUADRAN[k][2]]})}>
        <div class="row" style="padding-right:14px"><span class="t grow">${esc(koin(x.symbol))}</span>${chipK(k)}<span class="small num">niat ${Number(x.skor_niat).toFixed(2)}</span></div>
        <div class="reasons">${(x.alasan || []).map(r => `<span class="chip">${esc(r)}</span>`).join("")}</div></div>`).join("")}</div>` : "").join("")}
  </div>`;
}
function sinyal(D) {
  let h = ocklu(D);
  if (!D.sinyal.length) return h + '<div class="card"><p class="empty">Belum ada verdict.</p></div>';
  h += `<div class="card"><h2 ${i("Verdict teratas", {teks: ["8 koin dengan conviction tertinggi dari 6 mesin (INTEL · JWMQ · PALANTIR · ALADIN · MYTHOS · NX). Batang = conviction dibanding batas MYTHOS 0,777.", "Verdict: " + waktu(D.verdict_as_of)]})}>Verdict teratas ⓘ</h2><div class="list">${D.sinyal.map(s => `
    <div class="item" ${i(koin(s.symbol), {sub: s.nama || "", baris: [["Arah", s.direction], ["Label", s.label], ["Conviction", `${s.conviction} (batas 0,777)`],
        ["Kuadran OCKLU", s.kuadran ? (KUADRAN[s.kuadran] || [0, s.kuadran])[1] : "—"], ["Skor niat", s.skor_niat != null ? Number(s.skor_niat).toFixed(3) : "—"], ...komponenBaris(s.komponen_niat),
        ["Regime", s.regime], ["Risiko", s.risk], ["Tembus", s.tembus || "—"], ["Size saran", (s.size_pct ?? 0) + "% modal"], ["Stop saran", s.stop_pct != null ? s.stop_pct + "%" : "—"],
        ["Sinyal teknikal", (s.sinyal_teknikal || []).join(", ")], ["Gorengan", s.gorengan ? "ya — dicoret" : "tidak"]],
        daftar: [...(s.alasan_niat || []), ...(s.flags || [])]})}>
      <div class="row" style="padding-right:14px"><span class="t grow">${esc(koin(s.symbol))} <span class="small">${esc(s.nama || "")}</span></span>
        ${chipK(s.kuadran)}${s.gorengan ? '<span class="chip bad">gorengan</span>' : ""}<span class="chip ${s.direction === "LONG" ? "ok" : s.direction === "SHORT" ? "bad" : ""}">${esc(s.direction)}</span></div>
      <div class="row small num" style="margin-top:4px;padding-right:14px"><span class="grow">${esc(s.label)} · conv ${s.conviction}</span><span>niat ${s.skor_niat != null ? Number(s.skor_niat).toFixed(2) : "—"}</span></div>
      <div class="bar"><i style="width:${Math.min(100, (s.conviction || 0) / 0.777 * 100)}%"></i></div></div>`).join("")}</div></div>`;
  return h;
}

/* ---------- tab: Riwayat ---------- */
function riwayat(D) {
  if (!D.riwayat.length) return '<div class="card"><p class="empty">Belum ada order.</p></div>';
  return `<div class="card"><h2>Order (terbaru dulu)</h2><div class="list">${D.riwayat.map(r => `
    <div class="item" ${i(`${r.side} ${r.pair}`, {sub: `${r.bursa} · ${r.mode} · ${waktu(r.ts)}`, baris: [
        ["Harga", angka(r.price, r.quote)], ["Harga masuk", r.entry != null ? angka(r.entry, r.quote) : null], ["Untung-rugi", r.pnl_pct != null ? pct(r.pnl_pct) : null],
        ["Sebab keluar", r.reason], ["Stop", r.stop != null ? angka(r.stop, r.quote) : null], ["Target", r.target != null ? angka(r.target, r.quote) : null],
        ["Conviction", r.conviction], ["Jumlah", D.publik ? null : (r.amount != null ? angka(r.amount, r.quote) : null)], ["Verdict", r.verdict_as_of ? waktu(r.verdict_as_of) : null],
        ["Hash", r.hash], ["Hash sebelumnya", r.prev_hash]],
        teks: [r.reason ? SEBAB[r.reason] : "Order beli setelah lolos semua pagar dan Rumus OCKLU.", "Hash mengikat baris ini ke baris sebelumnya di ledger — tak bisa diubah diam-diam."]})}>
      <div class="row" style="padding-right:14px"><span class="chip ${r.side === "BUY" ? "ok" : "bad"}">${esc(r.side)}</span>
        <span class="t grow">${esc(r.pair)}</span>${chipMode(r.mode)}</div>
      <div class="row small num" style="margin-top:4px;padding-right:14px"><span class="grow">${esc(r.bursa)} · ${waktu(r.ts)}</span><span>@ ${esc(Number(r.price).toLocaleString("id-ID"))}</span></div>
      ${r.pnl_pct != null ? `<div class="small">${esc(r.reason)} · <b class="${cls(r.pnl_pct)}">${pct(r.pnl_pct)}</b></div>` : ""}
      <div class="small num" style="opacity:.7">⛓ ${esc((r.hash || "").slice(0, 16))}…</div></div>`).join("")}</div></div>`;
}

/* ---------- rangkai ---------- */
function render(D) {
  INFO = [];
  $("#sub").textContent = `diperbarui ${lalu(D.dibuat)} · ledger ${D.ledger.ok ? "utuh" : "PUTUS"} · ⓘ`;
  $("#banner").innerHTML = D.saklar_stop ? `<div class="banner" role="alert" ${i("Saklar STOP", {teks: ["File data/STOP ada di laptop. Selama ada, PEGASUS tak membuka posisi baru di semua bursa. Posisi yang ada tetap dijaga stop-nya.", "Hapus file itu untuk menyalakan lagi."]})}>⛔ Saklar STOP aktif — tak ada order baru.</div>` : "";
  $("#t-ringkas").innerHTML = ringkas(D);
  $("#t-posisi").innerHTML = posisi(D);
  $("#t-sinyal").innerHTML = sinyal(D);
  $("#t-riwayat").innerHTML = riwayat(D);
}
function pilihTab(t) {
  if (!document.getElementById("t-" + t)) t = "ringkas";
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", String(x.dataset.t === t)));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== "t-" + t);
  try { localStorage.setItem("pegasus-tab", t); } catch (e) {}
}
function muat() {
  const s = document.createElement("script");
  s.src = "data/pegasus.js?t=" + Date.now();
  s.onload = () => { if (window.PEGASUS) render(window.PEGASUS); s.remove(); };
  s.onerror = () => { $("#sub").textContent = "data belum ada — jalankan pegasus.py"; s.remove(); };
  document.head.appendChild(s);
}
let awal = (location.hash || "").slice(1);
if (!awal) { try { awal = localStorage.getItem("pegasus-tab") || ""; } catch (e) {} }
pilihTab(awal || "ringkas");
if (window.PEGASUS) render(window.PEGASUS); else muat();
setInterval(muat, 60000);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
