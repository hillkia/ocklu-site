<style>
:root{--bg:#07060b;--panel:#0d0c14;--line:#1d1b29;--pink:#c2338f;--txt:#d9d6e6;--dim:#7d7891;--hijau:#3ee08f;--merah:#ff4d6a;--kuning:#ffd25c;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font:13px/1.4 var(--mono)}
.wrap{max-width:980px;margin:0 auto}
.pita{height:6px;background:var(--pink);box-shadow:0 0 12px var(--pink)}
.p{background:var(--panel);padding:10px 12px;position:relative}
.dim{color:var(--dim)} .h{color:var(--hijau)} .m{color:var(--merah)} .k{color:var(--kuning)}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
/* panel 1 — grafik atas */
#p1{display:flex;gap:12px;align-items:stretch}
#c1{flex:1;height:120px;min-width:0}
.angka{min-width:150px;text-align:right;display:flex;flex-direction:column;justify-content:center;gap:4px}
.angka b{font-size:24px;color:var(--hijau);text-shadow:0 0 10px rgba(62,224,143,.5);font-variant-numeric:tabular-nums}
.chip{display:inline-block;border:1px solid var(--line);padding:1px 6px;font-size:10px;border-radius:3px}
/* panel 2 — analisa + screener */
#p2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px}
.kepala{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:6px}
.kepala .s{font-size:15px;font-weight:700;color:#fff}
#c2{width:100%;height:170px;display:block}
.cek{display:grid;grid-template-columns:1fr auto;gap:1px 10px;margin-top:6px;font-size:11px}
.pass{color:var(--hijau);font-weight:700}.fail{color:var(--merah);font-weight:700}
.scr{max-height:258px;overflow:auto;border-left:1px solid var(--line);padding-left:8px}
.scr table{width:100%;border-collapse:collapse;font-size:11px}
.scr td{padding:3px 4px;white-space:nowrap}
.scr tr{cursor:pointer}.scr tr:hover td{background:#16141f}
.scr tr.aktif td{background:#1d1530;color:#fff}
.bar{display:inline-block;width:42px;height:5px;background:#221f2e;vertical-align:middle;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--hijau)}
/* pita berjalan */
.ticker{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);font-size:10px;color:var(--dim);padding:5px 0}
.ticker span{display:inline-block;padding-left:100%;animation:jalan 40s linear infinite}
@keyframes jalan{to{transform:translateX(-100%)}}
/* panel 3 — kantor */
#kantor{display:grid;grid-template-columns:112px minmax(0,1fr) 150px;gap:10px;padding:14px 12px 18px;
 background:radial-gradient(ellipse at 50% 120%,#15122a 0,#0a0912 60%);min-height:420px}
.logo{font:800 26px/1 var(--mono);color:#fff;letter-spacing:-.04em}
.logo small{display:block;font-size:10px;letter-spacing:.3em;color:var(--dim);margin-top:4px}
.panji{width:46px;height:70px;margin:16px auto 0;background:#15121f;border:1px solid #2a2540;
 clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%);display:grid;place-items:center;color:#fff;font-weight:800}
.lemari{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.lemari i{height:16px;background:#1a1726;border-top:2px solid #3a3352}
.tanaman{font-size:22px;text-align:center;margin-top:14px;filter:saturate(.6)}
.tengah{display:flex;flex-direction:column;gap:12px;min-width:0}
.layar{background:#05040a;border:2px solid #2a2540;border-radius:4px;padding:6px;box-shadow:0 0 24px rgba(194,51,143,.18)}
.layar .judul{display:flex;justify-content:space-between;font-size:10px;color:var(--dim)}
#c3{width:100%;height:120px;display:block}
.cap{font-size:10px;text-align:center;color:#cfc8e8;background:#120f1d;border:1px solid #2a2540;padding:2px 6px;margin:4px auto 0;width:fit-content;max-width:100%}
.lantai{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px 10px;margin-top:6px}
.meja{position:relative;text-align:center;cursor:pointer}
.mon{height:34px;background:#0b0a12;border:1px solid #2d2843;border-radius:2px;position:relative;overflow:hidden}
.mon canvas{width:100%;height:100%;display:block}
.papan{height:14px;background:linear-gradient(#2a253b,#17141f);border-radius:2px;margin-top:-2px;transform:perspective(60px) rotateX(18deg)}
.kaki{display:flex;justify-content:space-between;padding:0 8px}.kaki i{width:3px;height:8px;background:#221e30}

.kata:after{content:"";position:absolute;top:100%;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:#f2eefc}
.meja.bicara .kata{opacity:1}
.meja:nth-child(5n+1) .kata{left:0;transform:none}.meja:nth-child(5n+1) .kata:after{left:14px}
.meja:nth-child(5n) .kata{left:auto;right:0;transform:none}.meja:nth-child(5n) .kata:after{left:auto;right:10px}

.ramai{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}

// candle dari close saja: buka = close sebelumnya (feed tidak punya OHLC per koin)
function lilin(c,arr){
  const [x,w,h]=kanvas(c);if(!arr||arr.length<3)return;
  const mn=Math.min(...arr),mx=Math.max(...arr),sy=v=>h-6-(v-mn)/((mx-mn)||1)*(h-12),n=arr.length-1,bw=w/n;
  x.strokeStyle='#1a1726';for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke()}
  for(let i=1;i<=n;i++){const o=arr[i-1],cl=arr[i],up=cl>=o;x.fillStyle=up?'#3ee08f':'#ff4d6a';
    const y1=sy(Math.max(o,cl)),y2=sy(Math.min(o,cl));x.fillRect((i-1)*bw+bw*.18,y1,Math.max(1,bw*.64),Math.max(1,y2-y1))}
  const l=sy(arr[n]);x.setLineDash([3,3]);x.strokeStyle='#c2338f';x.beginPath();x.moveTo(0,l);x.lineTo(w,l);x.stroke();x.setLineDash([]);
}

let pilih=0,putar=null;
function tampil(i){
  pilih=i;const k=D.koin[i];
  document.querySelectorAll('#tabel tr').forEach((r,j)=>r.classList.toggle('aktif',j===i));
  const arah=k.dir==='LONG'?'<span class="h">LONG</span>':k.dir==='SHORT'?'<span class="m">SHORT</span>':'<span class="dim">NETRAL</span>';
  $('kepala').innerHTML=`<span class="s">${k.s}</span><span class="dim">${k.nama||''}</span><span>$${fmt(k.last)}</span>
   <span class="${k.ch>=0?'h':'m'}">${pct(k.ch)}</span><span class="dim">kap ${usd(k.kap)} · vol ${usd(k.vol24)}</span>
   <span>${arah} ${k.label||''} ${(k.conv??0).toFixed(2)}</span>${k.gor?'<span class="k">⚠ gorengan</span>':''}`;
  lilin($('c2'),k.closes);lilin($('c3'),k.closes);
  $('cek').innerHTML=k.cek.map(([n,ok])=>`<span>${n}</span><span class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</span>`).join('');
  $('lyr-s').textContent=k.s+' · 4j';$('lyr-c').innerHTML=`<span class="${k.ch>=0?'h':'m'}">${pct(k.ch)}</span>`;
  $('cap').textContent=k.lulus===7?`${k.s} lolos 7/7 pagar — jendela masuk terbuka`:`${k.s} lolos ${k.lulus}/7 pagar — ${k.cek.find(c=>!c[1])[0]} belum`;
}

function mulai(){
  if(!D){document.body.innerHTML='<p style="padding:20px">Data belum ada — jalankan kantor.py</p>';return}
  const jam=D.as_of?(Date.now()-new Date(D.as_of))/36e5:0;
  if(jam>12){$('basi').style.display='block';$('basi').textContent=`DATA ${Math.round(jam)} JAM LALU — mesin belum memperbarui`}
  garis($('c1'),D.btc.closes,'#3ee08f',true);
  $('btc').textContent='$'+fmt(D.btc.last);$('btcch').innerHTML=`24j <span class="${D.btc.ch>=0?'h':'m'}">${pct(D.btc.ch)}</span>`;
  const p=D.peg;$('peg').innerHTML=`${p.mode||'PAPER'} · ${p.menang}/${p.tutup} menang · <span class="${(p.jumlah_pct||0)>=0?'h':'m'}">${pct(p.jumlah_pct)}</span>${p.rem?' · <span class="k">rem</span>':''}`;
  $('nscan').textContent=`${D.dipindai} koin dipindai, ${D.koin.length} teratas`;
  $('tabel').innerHTML=D.koin.map((k,i)=>`<tr data-i="${i}"><td>${k.s}</td><td class="${k.ch>=0?'h':'m'}">${pct(k.ch)}</td>
    <td><span class="bar"><i style="width:${Math.round((k.conv||0)*100)}%;background:${k.dir==='LONG'?'#3ee08f':k.dir==='SHORT'?'#ff4d6a':'#7d7891'}"></i></span></td>
    <td class="${k.lulus>=6?'pass':k.lulus>=4?'k':'fail'}">${k.lulus}/7</td></tr>`).join('');
  $('tabel').onclick=e=>{const r=e.target.closest('tr');if(r){tampil(+r.dataset.i);clearInterval(putar)}};
  // kantor
  $('lantai').innerHTML=D.meja.map((m,i)=>`<div class="meja" data-i="${i}" title="${m.nama}: ${m.kata.replace(/"/g,'&quot;')}">
    <div class="kata">${m.kata}</div><div class="mon"><canvas></canvas></div><div class="papan"></div><div class="kaki"><i></i><i></i></div>
    <div class="bot" style="background:${m.warna};color:${m.warna};animation-delay:${-i*.37}s"></div><div class="nama">${m.nama}</div></div>`).join('');
  document.querySelectorAll('.meja').forEach((el,i)=>{const k=D.koin[i%D.koin.length];garis(el.querySelector('canvas'),k.closes,D.meja[i].warna,true);
    el.onclick=()=>{document.querySelectorAll('.meja').forEach(m=>m.classList.remove('bicara'));el.classList.add('bicara')}});
  let b=0;const bicara=()=>{const ms=document.querySelectorAll('.meja');ms.forEach(m=>m.classList.remove('bicara'));ms[b%ms.length].classList.add('bicara');b++};
  bicara();setInterval(bicara,3200);
  const warna=['#e8445a','#f7931a','#7a5cff','#22b5e8','#c8a24a','#ff5ca8'];
  $('ramai').innerHTML=(D.ramai||[]).map((r,i)=>`<b style="background:${warna[i%6]}" title="${r.nama}">${(r.s||'').slice(0,5)}</b>`).join('')||'<span class="dim">–</span>';
  $('runner').innerHTML=D.top.s?`TOP RUNNER<br><b class="h">${D.top.s}</b> ${(D.top.conv||0).toFixed(2)}`:'TOP RUNNER';
  const t=[...D.masuk.map(s=>[s,1]),...D.keluar.map(s=>[s,-1]),...D.gor.map(s=>[s,0])].slice(0,14);
  $('titik').innerHTML=t.map(([s,a],i)=>{const sud=i/t.length*6.283,r=14+((i*17)%34);const x=55+Math.cos(sud)*r,y=55+Math.sin(sud)*r;
    return `<circle cx="${x}" cy="${y}" r="3" fill="${a>0?'#3ee08f':a<0?'#ff4d6a':'#ffd25c'}"><title>${s} ${a>0?'uang masuk':a<0?'uang keluar':'gorengan'}</title></circle>`}).join('');
  const sodor=D.koin.filter(k=>k.kuadran==='SODORKAN').map(k=>k.s);
  $('ticker').textContent=[`BTC $${fmt(D.btc.last)} ${pct(D.btc.ch)}`,`DIPINDAI ${D.dipindai}`,`SODORKAN ${sodor.join(', ')||'tidak ada'}`,
    `UANG MASUK ${D.masuk.length}`,`UANG KELUAR ${D.keluar.length}`,`GORENGAN ${D.gor.join(', ')||0}`,
    `BUKU BESAR ${D.ledger.entries||0} baris ${D.ledger.ok?'utuh':'RUSAK'}`,...(D.judul||[]).map(j=>'📰 '+j)].join('   ◆   ');
  const tik=()=>{$('jam').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})};tik();setInterval(tik,15000);
  $('sumber').textContent=`Sumber: ${D.source||'–'} · diperbarui ${D.as_of?new Date(D.as_of).toLocaleString('id-ID'):'–'}`;
  tampil(0);putar=setInterval(()=>tampil((pilih+1)%D.koin.length),5000);
  let rs;addEventListener('resize',()=>{clearTimeout(rs);rs=setTimeout(()=>{garis($('c1'),D.btc.closes,'#3ee08f',true);tampil(pilih)},200)});
}
mulai();
</script>
