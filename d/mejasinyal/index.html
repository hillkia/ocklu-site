<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="author" content="Ocklu">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Meja Sinyal Sosmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF0F0; --panel:#FFFFFF; --panel2:#F6F8F8;
  --ink:#141A1C; --ink2:#3D4A4D; --muted:#697679; --line:#D5DDDD; --line2:#E7EDED;
  --accent:#125B6B; --accent-soft:#DCEAEC; --accent-ink:#0B4451;
  --ok:#2A7A52; --ok-soft:#DDEEE5;
  --warn:#9C6B0E; --warn-soft:#F5E9CE;
  --crit:#B23B2E; --crit-soft:#F7E0DC;
  --shadow:0 1px 2px rgba(20,26,28,.06),0 8px 24px -16px rgba(20,26,28,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1416; --panel:#161D1F; --panel2:#1B2426;
    --ink:#E4EBEB; --ink2:#B6C3C4; --muted:#8A9899; --line:#243033; --line2:#1E282A;
    --accent:#57B6C7; --accent-soft:#173238; --accent-ink:#8FD3DF;
    --ok:#5CB98A; --ok-soft:#162C22;
    --warn:#D6A44A; --warn-soft:#2E2513;
    --crit:#E4796A; --crit-soft:#331A16;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1416; --panel:#161D1F; --panel2:#1B2426;
  --ink:#E4EBEB; --ink2:#B6C3C4; --muted:#8A9899; --line:#243033; --line2:#1E282A;
  --accent:#57B6C7; --accent-soft:#173238; --accent-ink:#8FD3DF;
  --ok:#5CB98A; --ok-soft:#162C22;
  --warn:#D6A44A; --warn-soft:#2E2513;
  --crit:#E4796A; --crit-soft:#331A16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Archivo,system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{max-width:1160px;margin:0 auto;padding:0 20px 90px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---- console bar ---- */
.console{position:sticky;top:0;z-index:40;background:var(--ground);border-bottom:1px solid var(--line);margin:0 -20px;padding:14px 20px 0}
.crow{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand b{font-family:Archivo;font-weight:800;font-size:19px;letter-spacing:-.03em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.gauge{display:flex;gap:16px;flex-wrap:wrap}
.g{display:flex;flex-direction:column;gap:0}
.g em{font-style:normal;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.g b{font-family:"IBM Plex Mono";font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.25}
.tt{background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer;align-self:center}
.tt:hover{border-color:var(--accent);color:var(--accent)}

.rail{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px 10px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500;font-size:14px}
.rail button:hover{color:var(--ink)}
.rail button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.rail .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;vertical-align:1px}

/* ---- generic ---- */
.pane{padding-top:26px}
.pane[hidden]{display:none!important}
.lede{color:var(--ink2);max-width:64ch;margin-bottom:20px}
.sec{margin-top:30px}
.sech{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sech h2{font-size:19px;font-weight:700}
.sech span{font-size:12.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:14.5px;width:100%;font-weight:500}
textarea{font-family:inherit;line-height:1.5;resize:vertical}
input:focus,select,textarea:focus{outline-offset:0}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#08171B}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:none;border:1px solid var(--line);color:var(--crit)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:600;letter-spacing:.02em;border:1px solid var(--line);color:var(--ink2)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted)}

/* ---- channel strips ---- */
.strip{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tone,var(--line));border-radius:9px;padding:13px 15px;display:grid;gap:11px;grid-template-columns:1fr;box-shadow:var(--shadow)}
@media(min-width:800px){.strip{grid-template-columns:minmax(190px,1.1fr) 2fr auto;align-items:center;gap:18px}}
.sid{display:flex;flex-direction:column;gap:3px;min-width:0}
.sid b{font-family:Archivo;font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.sid .meta{font-size:12px;color:var(--muted)}
.meters{display:flex;flex-direction:column;gap:7px}
.m{display:grid;grid-template-columns:74px 1fr 64px;gap:9px;align-items:center;font-size:11px}
.m i{font-style:normal;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.bar{position:relative;height:8px;background:var(--line2);border-radius:5px;overflow:visible}
.bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--tone,var(--accent))}
.bar>u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.65;text-decoration:none}
.m b{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right;font-weight:600}
.score{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
@media(min-width:800px){.score{align-items:flex-end}}
.score b{font-family:"IBM Plex Mono";font-size:27px;font-weight:600;line-height:1;color:var(--tone)}
.score em{font-style:normal;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---- findings ---- */
.find{display:grid;gap:9px;grid-template-columns:auto 1fr;padding:13px 0;border-top:1px solid var(--line2)}
.find:first-child{border-top:0}
.find .sev{width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--tone)}
.find h4{font-size:14.5px;font-weight:700;margin-bottom:3px}
.find p{font-size:13.5px;color:var(--ink2)}
.find .do{margin-top:6px;font-size:13.5px;background:var(--panel2);border-left:2px solid var(--accent);padding:7px 11px;border-radius:0 6px 6px 0}

/* ---- output blocks ---- */
.out{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:13px 15px;position:relative}
.out h5{font-family:Archivo;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.out ol,.out ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:7px}
.out li{font-size:14px}
.copy{position:absolute;top:10px;right:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:11.5px;cursor:pointer;color:var(--muted);font-weight:600}
.copy:hover{color:var(--accent);border-color:var(--accent)}
.mono{font-family:"IBM Plex Mono";font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---- checklist ---- */
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line2);cursor:pointer}
.ck:first-of-type{border-top:0}
.ck input{width:17px;height:17px;flex:0 0 auto;margin-top:2px;accent-color:var(--accent)}
.ck span{font-size:14px}
.ck .w{margin-left:auto;font-size:11px;color:var(--muted);font-family:"IBM Plex Mono";flex:0 0 auto}
.ck.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}

table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 10px 7px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}

.ladder{display:flex;flex-direction:column;gap:0}
.rung{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:15px 0;border-top:1px solid var(--line2)}
.rung:first-child{border-top:0}
.rung .k{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:"IBM Plex Mono";font-weight:600;font-size:14px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.rung.on .k{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.rung h4{font-size:15px;font-weight:700}
.rung .price{font-family:"IBM Plex Mono";font-size:13.5px;color:var(--accent-ink);font-weight:600;margin-top:2px}

.sld{display:grid;grid-template-columns:1fr 62px;gap:11px;align-items:center}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--accent)}
.funnel{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.fs{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:13px}
.fs .fb{height:22px;border-radius:5px;background:var(--accent);opacity:.9;min-width:2px}
.fs b{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-weight:600}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--ground);padding:9px 18px;border-radius:22px;font-size:13.5px;font-weight:600;opacity:0;transition:.22s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12.5px;color:var(--muted);margin-top:9px}

/* ---- lapisan AI (cuma nyala kalau otaknya kejangkau) ---- */
.aibtn{display:none!important}
:root[data-ai="on"] .aibtn{display:inline-flex!important}
.aibtn{align-items:center;gap:6px}
.aibtn::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.aibox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:9px;padding:14px 15px;margin-top:12px}
.aibox h5{font-family:Archivo;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 8px}
.aibox .mono{color:var(--ink)}
.aibox ol,.aibox ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:8px}
.aibox li{font-size:14.5px}
.aibox .why{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);animation:p 1.1s ease-in-out infinite;margin-right:7px;vertical-align:1px}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
.aibadge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;align-self:center}
.aibadge.off{background:none;color:var(--muted);border:1px solid var(--line)}
.hr{height:1px;background:var(--line);margin:26px 0}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:560px){.shell{padding:0 15px 80px}.console{margin:0 -15px;padding:12px 15px 0}.g b{font-size:15px}.gauge{gap:13px}}
</style>

<div class="console">
  <div class="shell" style="padding-bottom:0">
    <div class="crow">
      <div class="brand"><b>Meja Sinyal</b><span>konsol optimasi akun sosmed</span></div>
      <div class="gauge" id="gauge"></div>
      <span class="aibadge off" id="aibadge">mode aturan</span>
      <button class="tt" id="theme">tema</button>
    </div>
    <div class="rail" role="tablist" id="rail"></div>
  </div>
</div>

<div class="shell">
  <div class="pane" id="p-akun"></div>
  <div class="pane" id="p-audit" hidden></div>
  <div class="pane" id="p-konten" hidden></div>
  <div class="pane" id="p-seo" hidden></div>
  <div class="pane" id="p-celah" hidden></div>
  <div class="pane" id="p-uang" hidden></div>
  <div class="pane" id="p-rencana" hidden></div>
  <div class="pane" id="p-hasil" hidden></div>
  <footer><span>Meja Sinyal — semua angka dihitung dari data yang lo isi sendiri.</span><span>Disiapkan oleh Ocklu</span></footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)},
    $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

/* ================= LAPISAN AI =================
   Nyala cuma kalau halaman ini dibuka di penampil Claude. Di ocklu.com
   window.claude gak ada sama sekali → AI tetap null, tombol AI ngumpet,
   mesin aturan jalan seperti biasa. Gak ada yang rusak. */
var AI=null,AIOFF=false;
function aiOn(){return !!AI&&!AIOFF}
function setAI(){
  document.documentElement.setAttribute("data-ai",aiOn()?"on":"off");
  var b=document.getElementById("aibadge");if(!b)return;
  b.textContent=aiOn()?"otak nyala":"mode aturan";
  b.className="aibadge"+(aiOn()?"":" off");
}
var AIERR={
  not_granted:"Kamu belum ngizinin halaman ini nanya ke Claude. Mesin aturan tetap jalan.",
  sampling_disabled:"Fitur nanya-ke-Claude lagi dimatiin. Pakai hasil aturan di atas.",
  not_declared:"Halaman ini gak punya izin nanya. Pakai hasil aturan di atas.",
  capability_disabled:"Aksesnya dicabut. Mesin aturan tetap jalan.",
  capability_removed:"Aksesnya dicabut. Mesin aturan tetap jalan.",
  rate_limited:"Kebanyakan permintaan barusan. Tunggu sebentar, terus coba lagi.",
  prompt_too_large:"Datanya kepanjangan. Kurangin isian, terus coba lagi.",
  invalid_json:"Jawabannya gak kebaca sebagai data. Tekan sekali lagi.",
  refused:"Permintaannya ditolak. Ganti kata-kata topiknya.",
  empty_completion:"Jawabannya kosong. Tekan lagi.",
  cancelled:"Dibatalin.",
  session_expired:"Sesinya kedaluwarsa. Muat ulang halamannya.",
  upstream_error:"Sambungannya putus di tengah jalan. Coba lagi."
};
var DEAD={not_granted:1,sampling_disabled:1,not_declared:1,capability_disabled:1,capability_removed:1};
function aiFail(e){
  var c=(e&&e.code)||"upstream_error";
  if(DEAD[c]){AIOFF=true;setAI()}
  return AIERR[c]||"Gagal: "+((e&&e.message)||c);
}
/* satu pintu buat semua permintaan AI */
function ask(box,prompt,opts){
  opts=opts||{};
  var ttl=opts.title||"Tulisan AI";
  box.innerHTML='<h5>'+ttl+'</h5><p style="font-size:14px"><span class="pulse"></span>Lagi mikir…</p>';
  var run=opts.json?AI.json(prompt,{modelTier:opts.tier||"default"})
                   :AI(prompt,{modelTier:opts.tier||"default",
                       onText:function(p){box.innerHTML='<h5>'+ttl+'</h5><div class="mono">'+esc(p.text)+'</div>'}});
  return run.then(function(r){return r},function(e){
    box.innerHTML='<h5>'+ttl+'</h5><p style="font-size:14px">'+esc(aiFail(e))+'</p>'+
     (e&&e.text?'<div class="mono" style="margin-top:8px;opacity:.7">'+esc(e.text)+'</div>':'');
    throw e;
  });
}
function bahasa(){return S.lang==="en"?"casual American English, second person":"Bahasa Indonesia santai, panggil pembaca 'kamu', jangan kaku"}

/* ================= JURNAL HASIL =================
   Tiap saran yang dikerjain dicatat di sini beserta apa yang KEJADIAN.
   Yang gagal sengaja disimpan — dia jadi bahan buat pendapat kedua,
   biar mesin gak nyuruh hal yang udah kebukti gak jalan.
   Kalau db kejangkau, jurnalnya kesimpan di luar halaman juga sehingga
   bisa dibaca dari sesi Claude. Kalau nggak, tetap aman di localStorage. */
var DB=null;
function dbSync(e,hapus){
  if(!DB)return;
  try{
    var d=DB.doc("jurnal/"+e.id);
    (hapus?d.delete():d.set(e)).catch(function(){});
  }catch(err){}
}
function dbSyncAll(){
  if(!DB)return;
  try{
    DB.doc("meta/akun").set({diperbarui:new Date().toISOString(),
      akun:S.acc.map(function(a){var H=health(a);return{
        akun:"@"+a.h,platform:PLAT[a.plat].n,pengikut:a.f,tayangan:a.v,
        rasio:H.rr!=null?+H.rr.toFixed(2):null,keterikatan:H.er!=null?+H.er.toFixed(1):null,
        konten30:a.p30,tautan:!!a.link,penawaran:a.offer||"",sinyal:H.score}})}).catch(function(){});
    S.jur.forEach(function(e){dbSync(e)});
  }catch(err){}
}
var STAT={belum:["belum dikerjain","var(--muted)"],jalan:["lagi jalan","var(--warn)"],
          berhasil:["jalan, hasilnya naik","var(--ok)"],gagal:["udah dicoba, gak jalan","var(--crit)"]};
function catat(akun,saran,sumber,kunci){
  var e={id:"j"+Date.now()+Math.floor(Math.random()*99),akun:akun||"",saran:saran||"",
    sumber:sumber||"aturan",kunci:kunci||saran||"",status:"belum",sebelum:"",sesudah:"",
    catatan:"",tgl:new Date().toISOString().slice(0,10)};
  S.jur.unshift(e);save();dbSync(e);toast("Masuk ke tab Hasil ✓");
  renderRail();return e;
}
function gagalnya(){return S.jur.filter(function(e){return e.status==="gagal"})}
/* saran yang udah kebukti gak jalan buat akun itu */
function udahGagal(akun,kunci){
  return gagalnya().filter(function(e){return e.akun===akun&&e.kunci===kunci})[0]||null;
}

/* ================= PLATFORM BENCHMARKS =================
   Patokan kasar dari pola akun kecil–menengah. Bukan angka resmi platform —
   dipakai cuma sebagai garis pembanding, bukan vonis. */
var PLAT={
 instagram:{n:"Instagram",mid:0.65,good:1.5,er:3.5,cad:5,jam:"19.00–21.00",fmt:"Reels 7–20 dtk",
   seo:"Kata kunci di baris pertama caption + alt text. IG sekarang ngindeks teks caption & teks di layar."},

/* ================= MATH ================= */
function nf(n){if(n==null||isNaN(n))return "—";n=Math.round(n);return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function pct(n){return (Math.round(n*10)/10)+"%"}
function reachRatio(a){return (a.f>0&&a.v>0)?a.v/a.f:null}
function erate(a){var eng=(+a.l||0)+(+a.c||0);if(!eng)return null;var base=(+a.v||0)>0?a.v:a.f;return base>0?eng/base*100:null}

function health(a){
  var P=PLAT[a.plat],parts=[],miss=0;
  var rr=reachRatio(a), er=erate(a);
  if(rr!=null)parts.push([40,Math.min(100,rr/P.good*100)]); else miss+=40;
  if(er!=null)parts.push([25,Math.min(100,er/P.er*100)]); else miss+=25;
  var target=P.cad*4.3, cad=(+a.p30||0)/target*100;
  parts.push([20,Math.min(100,cad)]);
  var funnel=(a.link?55:0)+((a.offer&&a.offer.trim())?45:0);
  parts.push([15,funnel]);
  var w=0,sum=0;parts.forEach(function(p){w+=p[0];sum+=p[0]*p[1]});
  return {score:w?Math.round(sum/w):0,rr:rr,er:er,cad:cad,funnel:funnel,unknown:miss};
}
function tone(s){return s>=70?"var(--ok)":s>=45?"var(--warn)":"var(--crit)"}
function toneName(s){return s>=70?"ok":s>=45?"warn":"crit"}
function label(s){return s>=70?"sehat":s>=45?"pincang":"macet"}

}

/* hook scorer — aturan, bukan tebakan */
var BANNED=["hai guys","halo semuanya","di video kali ini","jangan lupa like","assalamualaikum semuanya","hey guys","in this video","welcome back"];
function scoreHook(t){
  t=(t||"").trim();var s=50,r=[];
  if(!t)return {s:0,r:[["crit","Kosong","Isi dulu hook-nya."]]};
  var w=t.split(/\s+/).length;
  if(w<=12){s+=10;r.push(["ok","Panjangnya pas ("+w+" kata)","Di bawah 12 kata — kebaca sebelum jempol gerak."])}
  else if(w<=18){r.push(["warn","Agak panjang ("+w+" kata)","Potong jadi ≤12 kata. Buang keterangan, sisain klaimnya."])}
  else{s-=15;r.push(["crit","Kepanjangan ("+w+" kata)","Ini paragraf, bukan hook. Ambil 8 kata paling tajam."])}
  if(/\d/.test(t)){s+=12;r.push(["ok","Ada angka","Angka bikin otak nyangka kontennya beres dan bisa diukur."])}
  else r.push(["warn","Gak ada angka","Tambahin jumlah: '5 kalimat', '3 hari', '2 menit'. Naikin klik tanpa ubah isi."]);
  if(/\b(kamu|kamu,|lo|anda|you|your|kalian)\b/i.test(t)){s+=10;r.push(["ok","Ngomong ke satu orang","Kata ganti orang kedua bikin yang nonton ngerasa dipanggil."])}
  else r.push(["warn","Belum nyapa siapa-siapa","Masukin 'kamu' atau sebutan audiensnya. Hook tanpa alamat = lewat."]);
  if(/^(jangan|stop|berhenti|jangan pernah|don't|stop)/i.test(t)){s+=8;r.push(["ok","Buka pakai penolakan","Kalimat larangan bikin orang berhenti buat mastiin dia gak salah."])}
  if(/\?$/.test(t)){s-=5;r.push(["warn","Diakhiri tanda tanya","Pertanyaan gampang dijawab dalam hati terus di-scroll. Ganti jadi pernyataan."])}
  var low=t.toLowerCase();var bad=BANNED.filter(function(b){return low.indexOf(b)>-1});
  if(bad.length){s-=25;r.push(["crit","Pembuka basa-basi: “"+bad[0]+"”","Hapus. 3 detik pertama itu jatah paling mahal, jangan dipake nyapa."])}
  if(/[A-Z]{6,}/.test(t)){s+=4;r.push(["ok","Ada penekanan kapital","Boleh, asal cuma 1–2 kata."])}
  if(low.split(/\s+/).length>3&&!/(cara|kenapa|yang|tanpa|padahal|ternyata|how|why|without|actually)/i.test(low)){
    s-=6;r.push(["warn","Belum ada celah penasaran","Sisipin 'tanpa', 'padahal', 'ternyata' — pemicu rasa kurang lengkap."])}
  if(/(sebenarnya|pada dasarnya|menurut saya|kayaknya|mungkin|agak|basically|honestly|i think|maybe|kind of)/i.test(low)){
    s-=8;r.push(["warn","Ada kata peredam","'kayaknya', 'mungkin', 'menurut aku' — bikin klaimnya lembek. Buang, langsung nyatakan."])}
  if(/(rahasia|viral|wajib tau|shocking|must know|life changing|game changer)/i.test(low)){
    s-=7;r.push(["warn","Kata umpan yang udah aus","'rahasia', 'wajib tau', 'viral' — dipakai semua orang, otak nyaringnya duluan. Ganti pakai hal spesifik."])}
  if(/\b(jam|menit|hari|minggu|detik|pagi|malam|minutes?|days?|weeks?|seconds?|tonight|tomorrow)\b/i.test(low)){
    s+=7;r.push(["ok","Ada waktu yang konkret","Waktu spesifik ('malam ini', '7 hari') bikin janjinya kebayang, bukan kabur."])}
  if(low.split(/\s+/).length>=3&&/^(cara|gimana|how to|how i)/i.test(low)&&!/\d/.test(low)){
    r.push(["warn","Pembuka 'cara …' tanpa batas","'Cara X' terlalu lebar. Tempel batasnya: 'tanpa teriak', 'dalam 5 menit', 'buat 2 orang'."])}
  if(t.length>0&&t===t.toUpperCase()&&/[A-Z]{3,}/.test(t)){
    s-=10;r.push(["crit","Kapital semua","Kebaca kayak teriak dan susah dipindai. Kapital cuma buat 1–2 kata penekanan."])}
  s=Math.max(0,Math.min(100,s));
  var ord={crit:0,warn:1,ok:2};r.sort(function(a,b){return ord[a[0]]-ord[b[0]]});
  return {s:s,r:r};
}

     extra=["Kalimat pertama = judul. Facebook motong di ~80 karakter.","Tautan taruh di komentar pertama, bukan di badan post.","Post yang gak ada tautannya dikasih jangkauan 2–3× lebih banyak."];break;
   case "threads":
     judul=cap(kw)+":";desk=cap(kw)+":\n\n1. …\n2. …\n3. …\n\n"+(L?"Which one are you doing tonight?":"Kamu mau mulai yang mana malam ini?");

   case "x":
     judul=cap(kw);desk=cap(kw)+"\n\n"+(L?"A thread on what actually works 🧵":"Utas: yang beneran jalan 🧵");

   case "telegram":
     judul=cap(kw);desk="**"+cap(kw)+"**\n\n"+(L?"For ":"Buat ")+aud+". "+res+".\n\n→ "+ctas(g)[1];
     tag=tag.slice(0,3);

   case "whatsapp":
     judul=cap(kw);desk=cap(kw)+"\n\n"+(L?"1 idea, 1 minute. ":"1 ide, 1 menit. ")+res+".\n\n"+ctas(g)[0];
     tag=[];
     extra=["Gak ada penemuan otomatis sama sekali. Pertumbuhan cuma dari tautan yang lo tempel di bio platform lain.","Nama channel = kata kunci + siapa yang dilayani.","Maksimal 1 pesan/hari. Lebih dari itu orang keluar."];break;
   case "linkedin":
     judul=cap(kw);desk=cap(kw)+".\n\n"+(L?"Most ":"Kebanyakan ")+aud+" "+(L?"are told to try harder.":"disuruh usaha lebih keras.")+"\n\n"+(L?"Here's the actual system:":"Ini sistem sebenarnya:")+"\n\n1. …";
     tag=tag.slice(0,3);
     extra=["3 baris pertama sebelum 'lihat selengkapnya' = 90% keputusan.","Headline profil lo juga mesin cari — masukin kata kunci ke situ.","Tautan di komentar pertama."];break;
   case "pinterest":
     judul=cap(kw)+" | "+cap(res);
     desk=cap(kw)+" "+(L?"for ":"buat ")+aud+". "+res+". "+(L?"Save for later.":"Simpan buat nanti.");
     tag=tagify(g,6);

   default:judul=cap(kw);desk=cap(kw);
  }

function ladder(){
  var T=totals(),acc=S.acc,best=0,er=0,n=0;
  acc.forEach(function(a){var h=health(a);if(h.rr!=null)best=Math.max(best,h.rr);if(h.er!=null){er+=h.er;n++}});
  er=n?er/n:0;
  var fol=T.fol,reach=T.reach;
  var brand=Math.max(fol*0.01,(reach/Math.max(1,acc.reduce(function(s,a){return s+(+a.p30||0)},0)))/1000*15);
  return [
   {k:"01",t:"Jasa 1-lawan-1",syarat:"Butuh: 1 penawaran tertulis + 30 orang yang tau lo ngerjain apa",ok:fol>=30,
    harga:"Rp250rb–750rb / sesi",why:"Paling cepat cair, paling gak butuh audiens. Ini yang dikerjain sambil nunggu angka naik."},
   {k:"02",t:"Produk digital kecil",syarat:"Butuh: 500 pengikut ATAU keterikatan ≥4%",ok:(fol>=500||er>=4),
    harga:"$9–39 (Rp150rb–650rb)",why:"Dibuat sekali, dijual terus. Ambil konten lo yang paling banyak disimpan orang, jadiin lembar kerja."},
   {k:"03",t:"Titipan merek / UGC",syarat:"Butuh: 1000 pengikut + 3 konten di atas "+"1.5× jangkauan",ok:(fol>=1000&&best>=1.5),
    harga:"$"+Math.round(brand)+"–"+Math.round(brand*2.5)+" / konten (±Rp"+nf(brand*S.kurs)+"–"+nf(brand*2.5*S.kurs)+")",
    why:"Dihitung dari yang lebih besar antara 1% jumlah pengikut atau $15 per 1000 tayangan."},
   {k:"04",t:"Langganan bulanan / komunitas",syarat:"Butuh: 2000 pengikut + tempat pindah yang lo punya sendiri",ok:(fol>=2000&&acc.some(function(a){return a.link})),
    harga:"$7–19 / bulan / orang",why:"Duit yang bisa diramal. 100 orang × $12 = $1.200/bulan, gak peduli algoritma lagi ngambek apa nggak."},
   {k:"05",t:"Retainer / kelas kohort",syarat:"Butuh: 5000 pengikut + 1 hasil klien yang bisa ditunjukin",ok:(fol>=5000),
    harga:"Rp5jt–25jt / bulan",why:"Ini titik di mana lo berhenti jualan konten dan mulai jualan hasil."}
  ];
}

    CK.forEach(function(c,i){tot+=c[0];if(st[i])got+=c[0];else miss.push(c)});

    return '<div class="card" style="border-left:3px solid '+st[1]+'" data-j="'+e.id+'">'+
     '<div class="row" style="justify-content:space-between;align-items:flex-start"><div class="row" style="gap:7px">'+
       '<span class="chip">'+esc(e.akun||"semua akun")+'</span><span class="chip">'+esc(e.sumber)+'</span>'+
       '<span class="chip" style="color:'+st[1]+'">'+st[0]+'</span>'+delta+'</div>'+
       '<button class="btn danger sm" data-jdel="'+e.id+'">Hapus</button></div>'+
     '<label class="f" style="margin-top:11px">Yang dikerjain<textarea rows="2" data-jf="saran|'+e.id+'">'+esc(e.saran)+'</textarea></label>'+
     '<div class="grid g3" style="margin-top:11px">'+
       '<label class="f">Status<select data-jf="status|'+e.id+'">'+
        Object.keys(STAT).map(function(k){return '<option value="'+k+'"'+(e.status===k?" selected":"")+'>'+STAT[k][0]+'</option>'}).join("")+'</select></label>'+
       '<label class="f">Angka sebelum<input type="number" value="'+esc(e.sebelum)+'" data-jf="sebelum|'+e.id+'" placeholder="2989"></label>'+
       '<label class="f">Angka sesudah<input type="number" value="'+esc(e.sesudah)+'" data-jf="sesudah|'+e.id+'" placeholder="4120"></label>'+
     '</div>'+
     '<label class="f" style="margin-top:11px">Catatan — kalau gak jalan, tulis kenapa<textarea rows="2" data-jf="catatan|'+e.id+'" placeholder="misalnya: hooknya diganti tapi tayangan tetap di 2rb, jadi masalahnya bukan di hook">'+esc(e.catatan)+'</textarea></label>'+
     '<div class="row" style="margin-top:9px"><label class="f" style="max-width:170px">Tanggal<input type="date" value="'+esc(e.tgl)+'" data-jf="tgl|'+e.id+'"></label></div>'+
     '</div>';
  }).join("")+'</div>';
  if(no)h+='<div class="sec"><div class="sech"><h2>Yang udah kebukti gak jalan</h2><span>mesin gak boleh nyaranin ini lagi</span></div><div class="card">'+
   gagalnya().map(function(e){return '<div class="find" style="--tone:var(--crit)"><div class="sev"></div><div><h4>'+esc(e.saran)+'</h4><p>'+esc(e.akun)+(e.catatan?' — '+esc(e.catatan):'')+'</p></div></div>'}).join("")+
   '</div></div>';
  $("#p-hasil").innerHTML=h;
  var dbn=$("#j-db");
  if(dbn)dbn.textContent=DB?"Kesimpan di luar halaman — bisa dibaca dari sesi Claude.":"Kesimpan di browser ini aja.";
  $("#j-new").onclick=function(){catat("","","sendiri","");drawHasil()};
  var ja=$("#j-ai");if(ja)ja.onclick=aiKedua;
  $$("[data-jf]").forEach(function(el){el.onchange=function(){
    var p=this.getAttribute("data-jf").split("|"),v=this.value;
    S.jur.forEach(function(e){if(e.id===p[1]){e[p[0]]=v;dbSync(e)}});
    save();if(p[0]==="status")drawHasil();renderGauge();
  }});
  $$("[data-jdel]").forEach(function(b){b.onclick=function(){
    var id=this.getAttribute("data-jdel");
    var e=S.jur.filter(function(x){return x.id===id})[0];
    S.jur=S.jur.filter(function(x){return x.id!==id});save();if(e)dbSync(e,true);drawHasil();toast("Dihapus")};
  });
}
/* ---- AI: pendapat kedua, wajib beda dari yang udah gagal ---- */
function aiKedua(){
  if(!aiOn())return;
  var box=$("#aihasil");box.className="aibox";
  var g=gagalnya(),jalan=S.jur.filter(function(e){return e.status!=="gagal"});
  if(!S.jur.length){box.innerHTML='<h5>Pendapat kedua</h5><p style="font-size:14px">Belum ada catatan buat dibaca. Catat dulu minimal satu hal yang udah kamu kerjain.</p>';return}
  var data=S.acc.map(function(a){var H=health(a);return "@"+a.h+" ("+PLAT[a.plat].n+"): "+nf(a.f)+" pengikut, rasio jangkauan "+(H.rr!=null?H.rr.toFixed(2)+"x":"?")+", keterikatan "+(H.er!=null?pct(H.er):"?")+", "+(a.p30||0)+" konten/bln"}).join("\n");
  var gagal=g.length?g.map(function(e){return "- "+e.akun+": \""+e.saran+"\" → GAGAL. "+(e.catatan||"tanpa catatan")+(e.sebelum&&e.sesudah?" (angka "+e.sebelum+" → "+e.sesudah+")":"")}).join("\n"):"(belum ada yang tercatat gagal)";
  var lain=jalan.length?jalan.map(function(e){return "- "+e.akun+": \""+e.saran+"\" → "+(STAT[e.status]||STAT.belum)[0]+(e.sebelum&&e.sesudah?" ("+e.sebelum+" → "+e.sesudah+")":"")}).join("\n"):"(kosong)";
  var p="Kamu penasihat kedua. Penasihat pertama udah kasih saran dan sebagiannya GAGAL. Jawab dalam "+bahasa()+".\n\n"+
   "ANGKA AKUN SEKARANG:\n"+data+"\n\nYANG UDAH DICOBA DAN GAGAL:\n"+gagal+"\n\nCATATAN LAIN:\n"+lain+"\n\n"+
   "Aturan keras:\n"+
   "- DILARANG nyaranin ulang apa pun yang ada di daftar gagal, walau dibungkus kata lain.\n"+
   "- Kalau yang gagal itu soal hook, berarti hambatannya bukan hook. Cari sebab yang lain.\n"+
   "- Sebut secara terang-terangan dugaan mana dari penasihat pertama yang kelihatannya salah, berdasarkan catatan gagal itu.\n"+
   "- Kalau datanya belum cukup buat nyimpulin, bilang data apa yang harus dikumpulin dulu — jangan nebak.\n\n"+
   "Jawab 3 bagian pendek:\n1. DUGAAN YANG SALAH — apa yang tadinya diasumsiin, tapi catatan gagal bilang sebaliknya.\n"+
   "2. ARAH BARU — satu jalur yang belum dicoba sama sekali, dengan alasannya nyambung ke angka di atas.\n"+
   "3. UJI PALING MURAH — satu percobaan kecil yang bisa selesai dalam 3 hari buat mastiin arah baru itu bener.";
  ask(box,p,{title:"Pendapat kedua"});
}

/* ================= BOOT ================= */
function draw(t){({akun:drawAkun,audit:drawAudit,konten:drawKonten,seo:drawSeo,celah:drawCelah,uang:drawUang,rencana:drawRencana,hasil:drawHasil})[t]()}
function refresh(){renderGauge();renderRail();draw(S.tab)}
$("#theme").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
};
TABS.forEach(function(x){$("#p-"+x[0]).hidden=(x[0]!==S.tab)});
refresh();
setAI();
try{
  if(window.claude&&typeof claude.use==="function"){
    claude.use("sample").then(function(s){AI=s||null;setAI();if(aiOn())draw(S.tab)},function(){setAI()});
    claude.use("db").then(function(d){
      if(!d)return;DB=d;dbSyncAll();
      if(S.tab==="hasil")draw("hasil");
    },function(){});
  }
}catch(e){setAI()}
})();
</script>
