# Halaman siap dibaca AI: produk TerTau (ocklu.com/tertau/produk/) dan pasar Hyper Market (ocklu.com/hypermarket/pasar/).
# Diperbarui tiap 3 jam dari API publik TerTau; commit hanya kalau produk/harga berubah. Jalan walau laptop owner mati.
name: tertau-produk

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buat halaman produk
        run: python3 tertau/terbit.py && python3 hypermarket/terbit-pasar.py && python3 warung/terbit-siap.py
      - name: Simpan kalau berubah
        run: |
          git config user.name "ocklu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tertau/produk/index.html hypermarket/pasar/index.html warung/siap/index.html
          git diff --cached --quiet || { git commit -m "Siap dibaca AI: perbarui produk TerTau, pasar Hyper Market & warung Ojol"; git push; }
