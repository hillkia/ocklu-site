# Direktori agen & layanan AI dari MCP Registry (ocklu.com/direktori-agen/), siap dibaca AI. Diperbarui sekali sehari
# (halamannya besar, jadi tidak tiap 3 jam); commit hanya kalau ada perubahan. Jalan walau laptop owner mati.
name: direktori-agen

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buat halaman direktori
        run: python3 direktori-agen/terbit.py
      - name: Simpan kalau berubah
        run: |
          git config user.name "ocklu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A direktori-agen
          git diff --cached --quiet || { git commit -m "Direktori agen: perbarui dari MCP Registry"; git pull --rebase -q; git push; }
