<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Anak Gusti</title>
<meta name="description" content="Kota mini sekolah minggu: masuk ke gedung-gedung untuk membaca cerita Alkitab, ayat hafalan, berdoa bersama, dan bermain.">
<meta name="theme-color" content="#f6d9b5">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icon.svg">
<style>
:root{
  --kertas:#fff8ef; --tinta:#3b2a1e; --lembut:#8a6d58; --oranye:#ff8a3d; --oranye2:#ffb36b;
  --hijau:#3fbf7f; --ungu:#8b6cf0; --kaca:rgba(255,248,239,.86); --garis:rgba(59,42,30,.12);
  --bayang:0 18px 50px rgba(80,40,10,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f3d3ae;color:var(--tinta);
  font-family:"Nunito","Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
#kanvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* label gedung melayang */
#label{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  background:var(--kaca);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:2px solid #fff;border-radius:999px;padding:6px 12px 6px 8px;font-weight:800;font-size:14px;
  box-shadow:0 6px 18px rgba(80,40,10,.22);white-space:nowrap;transition:transform .2s,opacity .3s;user-select:none}
.lbl:hover{transform:translate(-50%,-108%) scale(1.06)}
.lbl b{font-size:18px;margin-right:4px}
.lbl.redup{opacity:0;pointer-events:none}
/* atas */
#atas{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:14px 16px;pointer-events:none}
#atas>*{pointer-events:auto}
.judul{font-weight:900;font-size:22px;letter-spacing:.2px;text-shadow:0 2px 0 #fff;margin-right:auto}
.judul small{display:block;font-size:12px;font-weight:700;color:var(--lembut);text-shadow:none}
.chip{background:var(--kaca);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid #fff;
  border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(80,40,10,.18);cursor:pointer;
  display:flex;align-items:center;gap:6px;color:var(--tinta)}
button.chip{font:inherit;font-weight:800}
/* sambutan sinematik */
#sambut{position:fixed;inset:0;display:grid;place-items:center;text-align:center;
  background:radial-gradient(ellipse at 50% 60%,rgba(255,240,220,.0),rgba(60,30,10,.55));transition:opacity 1.2s;z-index:5}
#sambut h1{font-size:clamp(40px,9vw,88px);margin:0;color:#fff;font-weight:900;letter-spacing:1px;
  text-shadow:0 4px 0 #e0702a,0 12px 40px rgba(0,0,0,.35)}
#sambut p{color:#fff;font-weight:800;font-size:clamp(15px,3.6vw,20px);margin:10px 16px 26px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.mulai{font:inherit;font-size:20px;font-weight:900;border:0;border-radius:999px;padding:16px 34px;cursor:pointer;
  background:linear-gradient(180deg,#ffb36b,#ff7a2d);color:#fff;box-shadow:0 6px 0 #c95a17,0 16px 30px rgba(0,0,0,.25)}
.mulai:active{transform:translateY(3px);box-shadow:0 3px 0 #c95a17}
/* ruang (panel di dalam gedung) */
#ruang{position:fixed;inset:0;z-index:8;display:none;align-items:flex-end;justify-content:center;padding:16px}
#ruang.buka{display:flex}
#ruang .tirai{position:absolute;inset:0;background:rgba(60,30,10,.18)}
.panel{position:relative;width:min(760px,100%);max-height:min(82vh,820px);overflow:auto;background:var(--kertas);
  border-radius:28px;box-shadow:var(--bayang);border:3px solid #fff;padding:22px 20px 26px;
  animation:naik .55s cubic-bezier(.2,.9,.25,1.15)}
@keyframes naik{from{transform:translateY(40px) scale(.96);opacity:0}}
.panel h2{margin:0 0 4px;font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
.panel h2 .e{font-size:34px}
.panel .sub{margin:0 0 12px;color:var(--lembut);font-weight:700;font-size:14px}
.tutup{position:sticky;top:0;float:right;font:inherit;font-weight:900;font-size:16px;border:0;border-radius:999px;
  padding:9px 14px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.12);cursor:pointer;z-index:2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kartu{border-radius:20px;padding:16px 14px;color:#fff;font-weight:900;cursor:pointer;border:0;font:inherit;text-align:left;
  box-shadow:0 5px 0 rgba(0,0,0,.12);min-height:110px;display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .15s}
.kartu:hover{transform:translateY(-3px) rotate(-.5deg)}
.kartu .e{font-size:38px;line-height:1}
.kartu span{font-weight:900;font-size:16px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.kartu i{font-style:normal;font-size:12px;opacity:.9;font-weight:700}
.kotak{background:#fff;border-radius:18px;padding:16px;border:2px solid var(--garis);margin-bottom:12px}
.adegan{font-size:min(22vw,110px);text-align:center;line-height:1.2;padding:18px 0;border-radius:22px;margin-bottom:14px}
.teks{font-size:20px;line-height:1.55;font-weight:700}
.baris{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.baris.ujung{justify-content:space-between}
.tombol{font:inherit;font-weight:900;font-size:16px;border:0;border-radius:999px;padding:12px 20px;cursor:pointer;
  background:var(--oranye);color:#fff;box-shadow:0 4px 0 #c95a17}
.tombol.hijau{background:var(--hijau);box-shadow:0 4px 0 #2a8a5a}
.tombol.ungu{background:var(--ungu);box-shadow:0 4px 0 #5d43b8}
.tombol.putih{background:#fff;color:var(--tinta);box-shadow:0 4px 0 #e3d6c8}
.tombol:active{transform:translateY(2px);box-shadow:none}
.tombol:disabled{opacity:.45}
.pilihan{display:grid;gap:10px;margin-top:12px}
.pilihan button{font:inherit;font-size:18px;font-weight:800;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--garis);
  background:#fff;cursor:pointer;color:var(--tinta)}
.pilihan button.benar{background:#d8f7e6;border-color:var(--hijau)}
.pilihan button.salah{background:#ffe1dc;border-color:#ff7a6b}
.ayat{font-size:24px;line-height:1.5;font-weight:800;font-family:Georgia,"Times New Roman",serif}
.ref{color:var(--oranye);font-weight:900;margin-top:8px}
.pos{background:#fff;border-radius:16px;padding:12px 14px;border:2px solid var(--garis);margin-top:10px}
.pos .kepala{display:flex;gap:8px;align-items:center;font-weight:800}
.pos .kepala i{margin-left:auto;color:var(--lembut);font-style:normal;font-size:12px}
.pos p{margin:8px 0;font-size:17px;font-weight:600;white-space:pre-wrap;word-break:break-word}
textarea,input[type=text]{width:100%;font:inherit;font-size:17px;font-weight:700;border-radius:16px;border:2px solid var(--garis);
  padding:12px 14px;background:#fff;color:var(--tinta);resize:vertical}
.tab{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab button{font:inherit;font-weight:900;border:2px solid var(--garis);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--tinta)}
.tab button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.kitab{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.kitab button{font:inherit;font-weight:800;font-size:13px;border:0;border-radius:14px;padding:12px 6px;cursor:pointer;color:#3b2a1e;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.1)}
.urut button{display:block;width:100%;margin-top:8px}
.studio{position:relative;height:340px;border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:inset 0 0 0 2px var(--garis);touch-action:none}
.studio .st{position:absolute;font-size:46px;cursor:grab;user-select:none;transform:translate(-50%,-50%)}
.stiker{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.stiker button{font-size:28px;border:0;background:#fff;border-radius:12px;padding:4px 6px;cursor:pointer;border:2px solid var(--garis)}
.profil{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:3px solid var(--garis);border-radius:20px;padding:14px 8px;cursor:pointer;font:inherit;font-weight:800;color:var(--tinta)}
.profil.on{border-color:var(--oranye);background:#fff2e4}
.profil .ava{font-size:44px;line-height:1}
.profil img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.kecil{font-size:13px;color:var(--lembut);font-weight:700}
.tengah{text-align:center}
#label{display:none}
#kendali{display:none}
#zoom{position:fixed;right:16px;bottom:120px;display:flex;flex-direction:column;gap:10px;z-index:4}
#zoom button{width:52px;height:52px;border-radius:50%;border:2px solid #fff;background:var(--kaca);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:24px;font-weight:900;color:var(--tinta);box-shadow:0 4px 12px rgba(0,0,0,.15);cursor:pointer}
#pudar{position:fixed;inset:0;background:radial-gradient(circle at 50% 55%,#4a3326,#1c1410);opacity:0;pointer-events:none;transition:opacity .28s;z-index:7}
#joy{position:fixed;left:22px;bottom:46px;width:130px;height:130px;cursor:grab;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.85);display:block;z-index:4;touch-action:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#joy div{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#b-masuk{display:none;position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:6;font:inherit;font-size:18px;font-weight:900;border:0;border-radius:999px;padding:14px 24px;cursor:pointer;background:linear-gradient(180deg,#ffb36b,#ff7a2d);color:#fff;box-shadow:0 5px 0 #c95a17,0 12px 26px rgba(0,0,0,.25);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:999px;
  font-weight:800;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
footer{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-weight:900;font-size:13px;color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,.45);pointer-events:none;z-index:4;letter-spacing:.3px}
#petunjuk{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--kaca);border:2px solid #fff;border-radius:999px;
  padding:5px 10px;font-weight:800;font-size:11px;box-shadow:0 3px 10px rgba(80,40,10,.15);z-index:3;transition:opacity .6s;white-space:nowrap;cursor:pointer;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
body.malam .judul{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}body.malam .judul small{color:#e9dcff}
@media (max-width:520px){.judul{font-size:18px}.lbl{font-size:12px;padding:5px 10px 5px 6px}.lbl b{font-size:15px}.teks{font-size:18px}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
</style>
</head>
<body>
<canvas id="kanvas" aria-label="Kota Anak Gusti"></canvas>
<div id="label"></div>

<div id="atas">
  <div class="judul">✝️ Anak Gusti<small>Kota kecil sekolah minggu</small></div>
  <span class="chip" id="lokasi" style="display:none">🏙 Kota Anak Gusti</span>
  <button class="chip" id="b-waktu" title="Ganti siang / senja">☀️</button>
  <button class="chip" id="b-profil" title="Ganti teman">🦊 <span id="b-nama">Tamu</span> · ⭐ <span id="b-bintang">0</span></button>
</div>

<div id="sambut">
  <div>
    <h1>Anak Gusti</h1>
    <p>Selamat datang di kota kecil kita!<br>Jalan-jalan dan masuk ke gedung-gedungnya. 🏠</p>
    <button class="mulai" id="b-mulai">Ayo Masuk Kota ✨</button>
  </div>
</div>

<div id="petunjuk" style="opacity:0">👆 KLIK jalan ke situ · klik gedung untuk masuk · pad / WASD untuk jalan · E buka</div>

<div id="kendali"><div id="joy"><div></div></div><div id="zoom"><button id="z-plus" title="Dekatkan">＋</button><button id="z-min" title="Jauhkan">－</button><button id="z-putar" title="Putar kamera">⟳</button><button id="z-bantu" title="Petunjuk">❔</button></div></div>
<div id="pudar"></div>
<button id="b-masuk"></button>

<div id="ruang" role="dialog" aria-modal="true"><div class="tirai"></div><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<footer>Jesus is God ✝️</footer>

<script src="data.js"></script>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';

/* ============ PENYIMPANAN (sama persis dengan AntiokhiaKids) ============ */
// Mode publik (link HP di ocklu.com): tidak ada server → isi aman dari snapshot.json, sisanya tersimpan di HP sendiri
let ADA_SERVER = null, SNAP = null;
async function cekServer() {
  if (ADA_SERVER !== null) return ADA_SERVER;
  try { const r = await fetch('/api/status'); ADA_SERVER = r.ok && (r.headers.get('content-type') || '').includes('json'); } catch { ADA_SERVER = false; }
  if (!ADA_SERVER) { try { SNAP = await (await fetch('snapshot.json')).json(); } catch { SNAP = {}; } }
  return ADA_SERVER;
}
const store = {
  async get(k, d) {
    if (await cekServer()) { try { const r = await fetch('/api/store/' + k); if (r.ok) { const j = await r.json(); if (j !== null) { try { localStorage.setItem('ag-cache-' + k, JSON.stringify(j)); } catch {} return j; } return d; } } catch {} }
    else { try { const c = localStorage.getItem('ag-cache-' + k); if (c) return JSON.parse(c); } catch {} if (SNAP && SNAP[k] != null) return SNAP[k]; return d; }
    try { const c = localStorage.getItem('ag-cache-' + k); if (c) return JSON.parse(c); } catch {}
    return d;
  },
  async set(k, v) {
    try { localStorage.setItem('ag-cache-' + k, JSON.stringify(v)); } catch {}
    if (ADA_SERVER) try { await fetch('/api/store/' + k, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(v) }); } catch {}
  },
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const grad = g => `linear-gradient(135deg,${g[0]},${g[1]})`;
const acak = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); }
const AVATARS = ['🦊', '🐻', '🐰', '🐼', '🦁', '🐯', '🐨', '🐸', '🐧', '🦄', '🐶', '🐱', '🐹', '🐮', '🐥', '🐢'];

/* profil — format sama dengan AntiokhiaKids, jadi bintang & cerita terbaca ikut tersimpan di sana */
let profiles = [], aktif = null;
function fixProfile(p) { return { ...p, id: p.id || newId(), name: p.name || 'Sahabat', avatar: p.avatar || '🦊', photo: p.photo || null, points: p.points || 0, badges: p.badges || [], read: p.read || [] }; }
async function muatProfil() {
  profiles = await store.get('profiles', []); if (!Array.isArray(profiles)) profiles = [];
  profiles = profiles.map(fixProfile);
  let id = null; try { id = localStorage.getItem('ak-active'); } catch {}
  aktif = profiles.find(p => p.id === id) || profiles[0] || null;
  pitaProfil();
}
function pitaProfil() {
  document.getElementById('b-nama').textContent = aktif ? aktif.name : 'Tamu';
  document.getElementById('b-bintang').textContent = aktif ? aktif.points : 0;
  document.getElementById('b-profil').firstChild.textContent = (aktif ? aktif.avatar : '🙂') + ' ';
}
async function tambahBintang(n, alasan) {
  if (!aktif) { toast('Pilih namamu di Selamat Datang supaya bintangmu tersimpan ⭐'); return; }
  // ambil versi terbaru dulu supaya tidak menimpa bintang dari HP lain
  const terbaru = await store.get('profiles', []);
  if (Array.isArray(terbaru)) profiles = terbaru.map(fixProfile);
  const p = profiles.find(x => x.id === aktif.id) || aktif;
  p.points += n; aktif = p;
  if (!profiles.includes(p)) profiles.push(p);
  await store.set('profiles', profiles); pitaProfil();
  toast(`+${n} ⭐ ${alasan || ''}`);
}
function avatar(p, s = 22) { return p && p.photo ? `<img src="${esc(p.photo)}" style="width:${s}px;height:${s}px;border-radius:50%;object-fit:cover">` : `<span style="font-size:${s}px">${esc((p && p.avatar) || '🦊')}</span>`; }

/* cerita: bawaan + buatan kakak guru (sudah diperiksa manusia) */
let SEMUA_CERITA = STORIES;
async function muatCerita() {
  const custom = await store.get('custom-stories', []);
  const over = await store.get('story-overrides', {});
  const dasar = STORIES.map(s => (over && over[s.id]) ? { ...s, ...over[s.id] } : s);
  SEMUA_CERITA = dasar.concat(Array.isArray(custom) ? custom.filter(s => s && s.id && Array.isArray(s.pages)) : []);
}

/* ============ GEDUNG (gaya diorama kaca mengkilap seperti video) ============ */
// sudut = arah gedung di lingkar alun-alun; semua pintu menghadap ke tengah
const GEDUNG = [
  { id: 'cerita', nama: 'Perpustakaan Cerita', e: '📖', bentuk: 'awan', warna: 0xff8a3d, sudut: 0 },
  { id: 'ayat', nama: 'Ayat Emas', e: '📜', bentuk: 'mercusuar', warna: 0xffb547, sudut: 40 },
  { id: 'doa', nama: 'Ruang Doa', e: '🙏', bentuk: 'kapel', warna: 0xfff4e8, sudut: 80 },
  { id: 'alkitab', nama: 'Gedung Alkitab', e: '📚', bentuk: 'buku', warna: 0x8f78ee, sudut: 120 },
  { id: 'main', nama: 'Taman Games', e: '🎮', bentuk: 'istana', warna: 0x5fcf95, sudut: 160 },
  { id: 'jadwal', nama: 'Acara', e: '🗓', bentuk: 'jam', warna: 0x5cb8f0, sudut: 200 },
  { id: 'studio', nama: 'Studio Kreasi', e: '🎨', bentuk: 'palet', warna: 0xff8fb8, sudut: 240 },
  { id: 'rumah', nama: 'Selamat Datang', sub: 'Pendaftaran', e: '🏠', bentuk: 'rumah', warna: 0xff9f5a, sudut: 280 },
  { id: 'tonton', nama: 'Bioskop Kakak Guru', e: '🎬', bentuk: 'bioskop', warna: 0xff5e62, sudut: 320 },
];
const JARAK_GEDUNG = 36;

/* ============ ADEGAN 3D ============ */
const kanvas = document.getElementById('kanvas');
const renderer = new THREE.WebGLRenderer({ canvas: kanvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));   // hemat panas: 1.5× cukup tajam
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .92;
const scene = new THREE.Scene();
const LANGIT_SIANG = new THREE.Color(0xf7dcbc), LANGIT_SENJA = new THREE.Color(0x3a2a55);
scene.background = LANGIT_SIANG.clone();
scene.fog = new THREE.Fog(scene.background, 75, 160);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);

// pantulan lembut untuk kaca & plastik mengkilap (dibuat sendiri, tanpa file luar)
{
  const pm = new THREE.PMREMGenerator(renderer), env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(60, 60, 60), new THREE.MeshBasicMaterial({ color: 0xc9a483, side: THREE.BackSide })));
  [[0, 25, 0, 30], [-25, 8, 10, 14], [25, 10, -8, 12]].forEach(([x, y, z, s]) => {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })); p.position.set(x, y, z); p.lookAt(0, 0, 0); env.add(p);
  });
  scene.environment = pm.fromScene(env, .03).texture; scene.environmentIntensity = .55;
}
const hemi = new THREE.HemisphereLight(0xfff4e6, 0xb88a64, .55); scene.add(hemi);
const matahari = new THREE.DirectionalLight(0xfff0d8, 2.6);
matahari.position.set(-22, 38, 18); matahari.castShadow = true;
matahari.shadow.mapSize.set(1024, 1024);
Object.assign(matahari.shadow.camera, { left: -62, right: 62, top: 62, bottom: -62, near: 1, far: 160 });
matahari.shadow.bias = -0.0004; scene.add(matahari);

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .7, metalness: 0, ...o });

const jamDunia = new THREE.Clock(), sementara = new THREE.Vector3();

  jedaGambar += jamDunia.getDelta();

  const dt = Math.min(jedaGambar, .05), t = jamDunia.elapsedTime; jedaGambar = 0;
  // gerak karakter: arah selalu relatif ke kamera (atas = menjauhi kamera)
  let mx = 0, mz = 0;

    const f = (tombol['w'] || tombol['arrowup'] ? 1 : 0) - (tombol['s'] || tombol['arrowdown'] ? 1 : 0) - joy.y;
    const s = (tombol['d'] || tombol['arrowright'] ? 1 : 0) - (tombol['a'] || tombol['arrowleft'] ? 1 : 0) + joy.x;
    if (Math.abs(f) > .01 || Math.abs(s) > .01) { tujuanJalan = null; tujuanAksi = null; rute = []; mx = -Math.sin(kam.yaw) * f + Math.cos(kam.yaw) * s; mz = -Math.cos(kam.yaw) * f - Math.sin(kam.yaw) * s; }

      <div class="grid"><button class="kartu" style="background:${grad(['#6fd39a', '#3fbf7f'])}" id="g-urut"><span class="e">🔢</span><span>Urutkan Cerita</span><i>Ketuk kejadian sesuai urutan</i></button>
      <button class="kartu" style="background:${grad(['#9b84f0', '#6c5ce7'])}" id="g-kuis"><span class="e">❓</span><span>Kuis Kilat</span><i>Jawab pertanyaan cerita</i></button></div>`);
    panel.querySelector('#g-urut').onclick = mainUrut; panel.querySelector('#g-kuis').onclick = mainKuis;
  },

  /* 📚 Gedung Alkitab — 66 kitab */
  async alkitab(grup = -1) {
    isi(`<h2><span class="e">📚</span>Gedung Alkitab</h2><p class="sub">66 kitab dalam Alkitab. Ketuk sebuah kitab untuk membaca satu ayatnya.</p>
      <div class="tab"><button data-g="-1" class="${grup < 0 ? 'on' : ''}">Semua</button>${NEURON_GROUPS.map((x, i) => `<button data-g="${i}" class="${grup === i ? 'on' : ''}">${esc(x.n)}</button>`).join('')}</div>
      <div class="kotak" id="baca" style="display:none"></div><div class="kitab" id="kitab"></div>`);
    panel.querySelectorAll('.tab button').forEach(b => b.onclick = () => RUANG.alkitab(+b.dataset.g));
    const w = panel.querySelector('#kitab'), baca = panel.querySelector('#baca');
    NEURON_BOOKS.forEach(k => {
      if (grup >= 0 && k.g !== grup) return;
      const b = document.createElement('button'); b.textContent = k.n; b.style.background = NEURON_GROUPS[k.g].c;
      b.onclick = () => { baca.style.display = 'block'; baca.innerHTML = `<b>${esc(k.n)}</b> · <span class="kecil">${esc(NEURON_GROUPS[k.g].n)}</span><div class="ayat" style="font-size:20px;margin-top:6px">${esc(k.v)}</div>`; baca.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
      w.appendChild(b);
    });
  },

  /* 🗓 Acara — jadwal mingguan dari kakak guru */
  async jadwal() {
    await muatCerita();
    const s = await store.get('schedule', {}) || {};
    const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'], kini = new Date().getDay();
    isi(`<h2><span class="e">🗓</span>Acara</h2><p class="sub">Cerita yang dipilih kakak guru untuk tiap hari minggu ini.</p><div id="j"></div>`);
    const w = panel.querySelector('#j');
    HARI.forEach((h, i) => {
      const c = s[i] && SEMUA_CERITA.find(x => x.id === s[i].storyId);
      const d = document.createElement('div'); d.className = 'pos'; if (i === kini) d.style.borderColor = '#ff8a3d';
      d.innerHTML = `<div class="kepala">${i === kini ? '👉 ' : ''}${h}${i === kini ? ' (hari ini)' : ''}<i>${c ? esc(c.ref || '') : ''}</i></div><p>${c ? `${esc(c.emoji || '📖')} ${esc(c.title)}` : '<span class="kecil">Belum dijadwalkan</span>'}</p>${c ? '<button class="tombol" style="font-size:14px;padding:8px 14px">Baca 📖</button>' : ''}`;
      if (c) d.querySelector('button').onclick = () => bacaCerita(c, 0);
      w.appendChild(d);
    });
  },

  /* 🎨 Studio Kreasi — tempel stiker di latar */
  async studio() {
    let bg = 0;
    isi(`<h2><span class="e">🎨</span>Studio Kreasi</h2><p class="sub">Pilih latar, ketuk stiker, lalu geser stiker sesukamu. Buat gambar cerita Alkitabmu sendiri!</p>
      <div class="tab" id="latar">${BACKGROUNDS.map((b, i) => `<button data-i="${i}" class="${i === 0 ? 'on' : ''}">${esc(b.name)}</button>`).join('')}</div>
      <div class="studio" id="papan"></div><div class="stiker" id="stiker"></div>
      <div class="baris" style="margin-top:12px"><button class="tombol putih" id="b-bersih">🧹 Bersihkan</button><button class="tombol hijau" id="b-simpan">💾 Simpan gambar</button></div>`);
    const papan = panel.querySelector('#papan');
    const latar = () => papan.style.background = grad(BACKGROUNDS[bg].c); latar();
    panel.querySelectorAll('#latar button').forEach(b => b.onclick = () => { bg = +b.dataset.i; panel.querySelectorAll('#latar button').forEach(x => x.classList.toggle('on', x === b)); latar(); });
    function tempel(e, x = 50, y = 50) {
      const s = document.createElement('div'); s.className = 'st'; s.textContent = e; s.style.left = x + '%'; s.style.top = y + '%';
      s.onpointerdown = ev => { ev.preventDefault(); s.setPointerCapture(ev.pointerId); const r = papan.getBoundingClientRect();
        s.onpointermove = m => { s.style.left = Math.min(100, Math.max(0, (m.clientX - r.left) / r.width * 100)) + '%'; s.style.top = Math.min(100, Math.max(0, (m.clientY - r.top) / r.height * 100)) + '%'; };
        s.onpointerup = () => { s.onpointermove = null; }; };
      s.ondblclick = () => s.remove(); papan.appendChild(s);
    }
    const st = panel.querySelector('#stiker');
    STICKERS.forEach(e => { const b = document.createElement('button'); b.textContent = e; b.onclick = () => tempel(e, 20 + Math.random() * 60, 20 + Math.random() * 60); st.appendChild(b); });
    panel.querySelector('#b-bersih').onclick = () => papan.innerHTML = '';
    panel.querySelector('#b-simpan').onclick = () => {
      const r = papan.getBoundingClientRect(), c = document.createElement('canvas'); c.width = r.width * 2; c.height = r.height * 2;
      const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, c.width, c.height); g.addColorStop(0, BACKGROUNDS[bg].c[0]); g.addColorStop(1, BACKGROUNDS[bg].c[1]);
      x.fillStyle = g; x.fillRect(0, 0, c.width, c.height); x.font = '92px serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      papan.querySelectorAll('.st').forEach(s => x.fillText(s.textContent, parseFloat(s.style.left) / 100 * c.width, parseFloat(s.style.top) / 100 * c.height));
      x.font = 'bold 22px sans-serif'; x.fillStyle = 'rgba(255,255,255,.9)'; x.fillText('Anak Gusti · Jesus is God', c.width / 2, c.height - 24);
      const a = document.createElement('a'); a.download = 'gambar-anak-gusti.png'; a.href = c.toDataURL('image/png'); a.click();
      if (papan.querySelector('.st')) tambahBintang(3, 'karya studio');
    };
  },
};

/* baca cerita halaman demi halaman → kuis → bintang */
function bacaCerita(s, i) {
  const pg = s.pages[i];
  if (!pg) return kuisCerita(s);
  isi(`<h2><span class="e">${esc(s.emoji || '📖')}</span>${esc(s.title)}</h2><p class="sub">${esc(s.ref || '')} · halaman ${i + 1} dari ${s.pages.length}</p>
    <div class="adegan" style="background:${grad(s.grad || ['#ffe2b8', '#ffb36b'])}">${esc(pg.scene || '')}</div>
    <div class="teks">${esc(pg.text)}</div>
    <div class="baris ujung" style="margin-top:18px"><button class="tombol putih" id="b-mundur" ${i === 0 ? 'disabled' : ''}>◀ Kembali</button>
    <button class="tombol" id="b-maju">${i === s.pages.length - 1 ? 'Selesai 🎉' : 'Lanjut ▶'}</button></div>`);
  panel.querySelector('#b-mundur').onclick = () => bacaCerita(s, i - 1);
  panel.querySelector('#b-maju').onclick = () => bacaCerita(s, i + 1);
}
async function kuisCerita(s) {
  if (aktif && !aktif.read.includes(s.id)) {
    const terbaru = await store.get('profiles', []); if (Array.isArray(terbaru)) profiles = terbaru.map(fixProfile);
    const p = profiles.find(x => x.id === aktif.id); if (p && !p.read.includes(s.id)) { p.read.push(s.id); aktif = p; await store.set('profiles', profiles); }
    await tambahBintang(10, 'selesai membaca');
  }
  const soal = Array.isArray(s.quiz) ? s.quiz : [];
  if (!soal.length) return isi(`<h2><span class="e">🎉</span>Hebat!</h2><p class="sub">Kamu sudah selesai membaca “${esc(s.title)}”.</p>${s.verse ? `<div class="kotak"><div class="ayat" style="font-size:20px">${esc(s.verse)}</div></div>` : ''}<button class="tombol" onclick="document.getElementById('b-keluar').click()">Kembali ke kota 🏙</button>`);
  let n = 0, benar = 0;
  function tampil() {
    if (n >= soal.length) {
      isi(`<h2><span class="e">🏆</span>Kuis selesai!</h2><p class="sub">Benar ${benar} dari ${soal.length}.</p>${s.verse ? `<div class="kotak"><b>Ayat cerita ini:</b><div class="ayat" style="font-size:20px">${esc(s.verse)}</div></div>` : ''}
        <div class="baris"><button class="tombol putih" id="b-ulang">🔁 Baca lagi</button><button class="tombol" id="b-rak">📖 Cerita lain</button></div>`);
      panel.querySelector('#b-ulang').onclick = () => bacaCerita(s, 0); panel.querySelector('#b-rak').onclick = RUANG.cerita;
      if (benar) tambahBintang(benar * 2, 'jawaban benar');
      return;
    }
    const q = soal[n];
    isi(`<h2><span class="e">❓</span>Kuis: ${esc(s.title)}</h2><p class="sub">Soal ${n + 1} dari ${soal.length}</p><div class="teks">${esc(q.q)}</div><div class="pilihan" id="pil"></div>`);
    const w = panel.querySelector('#pil');
    q.a.forEach((a, i) => { const b = document.createElement('button'); b.textContent = a; b.onclick = () => {
      w.querySelectorAll('button').forEach(x => x.disabled = true);
      if (i === q.correct) { b.classList.add('benar'); benar++; } else { b.classList.add('salah'); w.children[q.correct].classList.add('benar'); }
      setTimeout(() => { n++; tampil(); }, 1100); }; w.appendChild(b); });
  }
  tampil();
}
function mainUrut() {
  const pilihan = SEMUA_CERITA.filter(s => Array.isArray(s.order) && s.order.length > 2);
  const s = pilihan[Math.floor(Math.random() * pilihan.length)];
  const acakan = acak(s.order.map((t, i) => ({ t, i }))); let berikut = 0, salah = 0;
  isi(`<h2><span class="e">🔢</span>Urutkan: ${esc(s.title)}</h2><p class="sub">Ketuk kejadian dari yang pertama sampai terakhir.</p><div class="urut" id="u"></div>
    <div class="baris" style="margin-top:14px"><button class="tombol putih" id="b-lain">🔁 Cerita lain</button><button class="tombol putih" id="b-balik">◀ Taman Games</button></div>`);
  const w = panel.querySelector('#u');
  acakan.forEach(o => { const b = document.createElement('button'); b.className = 'tombol putih'; b.textContent = o.t; b.style.textAlign = 'left';
    b.onclick = () => {
      if (o.i === berikut) { b.className = 'tombol hijau'; b.textContent = (berikut + 1) + '. ' + o.t; b.disabled = true; berikut++;
        if (berikut === s.order.length) { toast('Urutannya benar semua! 🎉'); tambahBintang(salah ? 3 : 5, 'urutan benar'); } }
      else { salah++; b.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], 250); }
    }; w.appendChild(b); });
  panel.querySelector('#b-lain').onclick = mainUrut; panel.querySelector('#b-balik').onclick = RUANG.main;
}
function mainKuis() {
  const semua = []; SEMUA_CERITA.forEach(s => (s.quiz || []).forEach(q => semua.push({ ...q, judul: s.title })));
  const soal = acak(semua).slice(0, 5); let n = 0, benar = 0;
  function tampil() {
    if (n >= soal.length) { isi(`<h2><span class="e">🏆</span>Kuis Kilat selesai!</h2><p class="sub">Benar ${benar} dari ${soal.length}.</p><div class="baris"><button class="tombol" id="b-lagi">🔁 Main lagi</button><button class="tombol putih" id="b-balik">◀ Taman Games</button></div>`);
      panel.querySelector('#b-lagi').onclick = mainKuis; panel.querySelector('#b-balik').onclick = RUANG.main; if (benar) tambahBintang(benar, 'kuis kilat'); return; }
    const q = soal[n];
    isi(`<h2><span class="e">❓</span>Kuis Kilat</h2><p class="sub">Soal ${n + 1}/${soal.length} · dari cerita “${esc(q.judul)}”</p><div class="teks">${esc(q.q)}</div><div class="pilihan" id="pil"></div>`);
    const w = panel.querySelector('#pil');
    q.a.forEach((a, i) => { const b = document.createElement('button'); b.textContent = a; b.onclick = () => {
      w.querySelectorAll('button').forEach(x => x.disabled = true);
      if (i === q.correct) { b.classList.add('benar'); benar++; } else { b.classList.add('salah'); w.children[q.correct].classList.add('benar'); }
      setTimeout(() => { n++; tampil(); }, 1000); }; w.appendChild(b); });
  }
  tampil();
}

muatProfil(); Promise.all([muatCerita(), muatGembala()]).then(() => GEDUNG.forEach(isiAula));
</script>
