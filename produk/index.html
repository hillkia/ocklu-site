<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocklu Produk — Katalog Pack</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0e14;--card:#151a24;--line:#232b3a;--tx:#e6edf3;--dim:#8b98a9;
--acc:#4ade80;--acc2:#38bdf8}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fb;--card:#fff;--line:#e2e8f0;
--tx:#0f172a;--dim:#64748b;--acc:#16a34a;--acc2:#0284c7}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;
background:var(--bg);z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0}
.sub{font-size:12px;color:var(--dim);width:100%}
main{max-width:820px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx);
padding:11px 13px;border-radius:10px;outline:none;font:inherit}
.btn{background:var(--acc);color:#052e16;text-decoration:none;padding:11px 14px;
border-radius:10px;font-weight:700;font-size:14px;white-space:nowrap;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
margin-bottom:12px;overflow:hidden}
.head{padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.head .nm{font-weight:700;flex:1}
.head .pr{color:var(--acc);font-weight:700}
.head .ni{font-size:12.5px;color:var(--dim);width:100%;margin-top:2px}
.body{padding:0 16px 16px;display:none;border-top:1px solid var(--line)}
.card.open .body{display:block}
.card.open .head{padding-bottom:10px}
h4{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--acc2);
margin:16px 0 8px}
.reel{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:8px 0}
.reel .t{font-weight:600;font-size:13.5px;margin-bottom:4px}
.reel code{display:block;white-space:pre-wrap;font-size:12.5px;color:var(--dim)}
.cp{float:right;font-size:11px;background:transparent;border:1px solid var(--line);
color:var(--acc2);border-radius:6px;padding:2px 8px;cursor:pointer;margin-left:8px}
.kv{font-size:13.5px;margin:4px 0}
.kv b{color:var(--dim);font-weight:600}
.chips span{display:inline-block;background:var(--bg);border:1px solid var(--line);
border-radius:20px;padding:2px 9px;margin:3px 3px 0 0;font-size:11.5px}
.email{white-space:pre-wrap;background:var(--bg);border-left:3px solid var(--acc);
padding:10px 12px;border-radius:6px;font-size:13px;margin-top:6px}
.muted{color:var(--dim);font-size:12px}
.foot{text-align:center;color:var(--dim);font-size:11.5px;padding:24px 0}
</style>
</head>
<body>
<header>
  <h1>🏭 Ocklu Produk</h1>
  <a class="btn" id="baru" href="#" target="_blank" rel="noopener">＋ Produk baru</a>
  <div class="sub" id="sub">memuat…</div>
</header>
<main>
  <div class="bar"><input id="q" placeholder="cari pack / niche / produk…" oninput="render()"></div>
  <div id="list"></div>
  <div class="foot">Katalog statis · dibikin di GitHub Actions · laptop mati tetap jalan.<br>
  Produksi baru → tombol ＋ (jalan di server GitHub).</div>
</main>
<script>
const ACTIONS="https://github.com/hillkia/ocklu-produk/actions/workflows/produksi.yml";
document.getElementById('baru').href=ACTIONS;
let DATA={packs:[]};
const esc=s=>(s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function copy(t){navigator.clipboard&&navigator.clipboard.writeText(t);}
async function load(){
  try{const r=await fetch('data/packs.json?_='+Date.now());DATA=await r.json();
    document.getElementById('sub').textContent=`${DATA.jml} pack · diperbarui ${DATA.diperbarui}`;
  }catch(e){document.getElementById('sub').textContent='gagal memuat data';}
  render();
}
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const list=document.getElementById('list');
  const packs=DATA.packs.filter(p=>!q||JSON.stringify(p).toLowerCase().includes(q));
  if(!packs.length){list.innerHTML='<p class="muted">tak ada pack. Tekan ＋ Produk baru.</p>';return;}
  list.innerHTML=packs.map((p,i)=>{
    const et=p.etsy||{},ou=p.outreach||{},bu=p.bundle||{};
    const reels=(p.reels||[]).map(r=>`<div class="reel"><div class="t">${esc(r.judul)}
      <button class="cp" onclick="copy(this.nextElementSibling.textContent)">salin</button></div>
      <code>${esc(r.prompt)}</code></div>`).join('');
    const tags=(et.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('');
    return `<div class="card" id="c${i}">
      <div class="head" onclick="document.getElementById('c${i}').classList.toggle('open')">
        <span class="nm">📦 ${esc(p.pack)}</span><span class="pr">$${esc(String(et.harga_usd||''))}</span>
        <span class="ni">${esc(p.niche)} · dari "${esc(p.produk)}" · ${esc(p.dibuat)}</span>
      </div>
      <div class="body">
        <h4>Reels — tempel ke Higgsfield MCP</h4>${reels}
        <h4>Bundle Canva</h4>
        <div class="kv">Carousel ${bu.carousel_post||0} · Static ${bu.static_post||0} · Story ${bu.story_post||0} · Typography ${bu.typography_post||0}</div>
        <div class="muted">${esc(bu.catatan_canva||'')}</div>
        <h4>Listing Etsy</h4>
        <div class="kv"><b>Judul:</b> ${esc(et.judul||'')}</div>
        <div class="kv"><b>Deskripsi:</b> ${esc(et.deskripsi||'')}</div>
        <div class="kv"><b>Mockup:</b> ${esc(et.brief_mockup||'')}</div>
        <div class="chips">${tags}</div>
        <h4>Outreach <button class="cp" onclick="copy(this.parentElement.nextElementSibling.nextElementSibling.textContent)">salin email</button></h4>
        <div class="kv"><b>Subject:</b> ${esc(ou.subject||'')}</div>
        <div class="email">${esc(ou.email||'')}</div>
        <div class="muted" style="margin-top:6px">Threads: ${esc(ou.threads_hook||'')} · otak: ${esc(p.otak||'')}</div>
      </div></div>`;
  }).join('');
}
load();
</script>
</body>
</html>
