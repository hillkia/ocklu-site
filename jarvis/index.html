<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" href="ikon-192.png" type="image/png">
<title>Ocklu Jarvis</title>
<style>
  :root{
    --latar:#05070a; --kartu:#0b0f15; --garis:#1a2029;
    --redup:#5b6673; --sedang:#8b95a3; --terang:#dbe3ec; --putih:#f4f7fb;
    --hijau:#4ade80; --kuning:#fbbf24; --merah:#f87171; --nyala:#7c5cff; --nyala2:#b48cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--latar);color:var(--terang);
    font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;user-select:none}
  #papan{position:fixed;inset:0;display:block;touch-action:none}

  header{position:fixed;top:0;left:0;right:0;z-index:5;
    padding:max(12px,env(safe-area-inset-top)) 14px 12px;
    display:flex;align-items:center;gap:9px;
    background:linear-gradient(180deg,rgba(5,7,10,.92),rgba(5,7,10,0))}
  .lampu{width:8px;height:8px;border-radius:50%;background:var(--hijau);flex:none;
    box-shadow:0 0 9px rgba(74,222,128,.6)}
  .lampu.tua{background:var(--kuning);box-shadow:0 0 9px rgba(251,191,36,.6)}
  h1{margin:0;font-size:14px;font-weight:650;letter-spacing:.09em;color:var(--putih);flex:1}
  .kecil{font-size:10px;color:var(--redup);white-space:nowrap}

  /* cincin reaktor */
  #cincin{position:fixed;top:calc(env(safe-area-inset-top) + 46px);left:50%;
    transform:translateX(-50%);z-index:4;width:118px;height:118px;pointer-events:none}
  #nama{position:fixed;top:calc(env(safe-area-inset-top) + 96px);left:0;right:0;z-index:5;
    text-align:center;pointer-events:none;font-size:9px;font-weight:600;letter-spacing:.22em;
    color:#e3d9ff;text-shadow:0 0 10px rgba(140,110,255,.75)}
  #pil{position:fixed;top:calc(env(safe-area-inset-top) + 168px);left:0;right:0;z-index:5;
    display:flex;justify-content:center;gap:5px;pointer-events:none;flex-wrap:wrap;padding:0 14px}
  .pil{font-size:8px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
    padding:3px 9px;border-radius:99px;background:rgba(12,16,22,.9);
    border:1px solid rgba(120,140,165,.28);color:var(--sedang)}
  .pil.ungu{color:var(--nyala2);border-color:rgba(124,92,255,.45);background:rgba(124,92,255,.1)}
  .pil.hijau{color:var(--hijau);border-color:rgba(74,222,128,.4)}

  /* gelembung jawaban */
  #gelembung{position:fixed;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));
    z-index:6;padding:13px 15px;border-radius:13px;background:rgba(12,16,22,.95);
    border:1px solid rgba(120,140,165,.26);font-size:14px;line-height:1.55;
    box-shadow:0 14px 44px rgba(0,0,0,.66);opacity:0;pointer-events:none;
    transition:opacity .22s;max-height:42vh;overflow-y:auto}
  #gelembung.tampil{opacity:1;pointer-events:auto}
  #gelembung .siapa{font-size:8px;letter-spacing:.18em;color:#4a5462;
    margin-bottom:5px;text-transform:uppercase}

  /* bar bawah */
  #bawah{position:fixed;left:0;right:0;bottom:0;z-index:7;
    padding:9px 12px calc(11px + env(safe-area-inset-bottom));
    background:rgba(8,11,16,.94);backdrop-filter:blur(14px);border-top:1px solid var(--garis);
    display:flex;gap:8px;align-items:center}
  #tanya{flex:1;min-width:0;padding:11px 14px;font:inherit;font-size:15px;color:var(--terang);
    background:rgba(255,255,255,.05);border:1px solid var(--garis);border-radius:99px;outline:none}
  #tanya:focus{border-color:rgba(124,92,255,.5)}
  #tanya::placeholder{color:#3d4653}
  .bulat{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:19px;background:rgba(16,20,28,.9);border:1px solid rgba(120,140,165,.26);
    cursor:pointer}
  .bulat:active{transform:scale(.94)}
  .bulat.nyala{border-color:var(--hijau);background:rgba(74,222,128,.16)}

  /* saringan kategori */
  #saring{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));
    z-index:5;display:flex;gap:6px;overflow-x:auto;padding:0 12px 2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #saring::-webkit-scrollbar{display:none}
  .cip{flex:none;display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;
    font-size:11px;white-space:nowrap;background:rgba(12,16,22,.92);
    border:1px solid var(--garis);color:var(--sedang);cursor:pointer}
  .cip.mati{opacity:.32}
  .cip i{width:6px;height:6px;border-radius:50%;display:block}

  /* lembar rincian simpul */
  #tirai{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:8;opacity:0;
    pointer-events:none;transition:opacity .2s}
  #tirai.buka{opacity:1;pointer-events:auto}
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--kartu);
    border-top:1px solid var(--garis);border-radius:18px 18px 0 0;
    padding:8px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
    max-height:70vh;overflow-y:auto}
  #panel.buka{transform:translateY(0)}
  .pegangan{width:38px;height:4px;border-radius:99px;background:#28313d;margin:6px auto 14px}
  #p-k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
  #p-l{font-size:22px;font-weight:660;color:var(--putih);line-height:1.25;margin:4px 0 3px}
  #p-d{font-size:13px;color:var(--sedang);margin-bottom:14px}
  .p-bab{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--redup);margin:14px 0 6px}
  .tetangga{display:flex;flex-wrap:wrap;gap:6px}
  .tt{font-size:12px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.05);
    border:1px solid var(--garis);color:var(--terang);cursor:pointer}

  /* gerbang */
  #gerbang{position:fixed;inset:0;background:var(--latar);z-index:10;display:grid;
    place-items:center;padding:28px}
  #gerbang .kotak{width:100%;max-width:300px;text-align:center}
  #gerbang h2{margin:0 0 6px;font-size:16px;color:var(--putih)}
  #gerbang p{font-size:12.5px;color:var(--redup);margin:0 0 18px;line-height:1.55}
  #pin{width:100%;padding:14px;font:inherit;font-size:17px;text-align:center;
    color:var(--putih);background:var(--kartu);border:1px solid var(--garis);
    border-radius:11px;outline:none}
  #buka{width:100%;margin-top:10px;padding:14px;font:inherit;font-size:15px;font-weight:600;
    color:#fff;background:var(--nyala);border:0;border-radius:11px}
  #pesan{font-size:12.5px;margin-top:12px;min-height:17px;color:var(--kuning)}
  .sembunyi{display:none!important}

  /* panel kiri — disembunyikan di HP, dinyalakan oleh aturan layar lebar */
  #sisi{position:fixed;left:0;top:0;bottom:0;width:252px;z-index:6;display:none;
    flex-direction:column;padding:18px 16px;gap:10px;overflow-y:auto;
    background:linear-gradient(180deg,rgba(6,8,12,.96),rgba(6,8,12,.88));
    border-right:1px solid var(--garis);backdrop-filter:blur(9px)}
  #sisi .judul{font-size:13px;font-weight:650;letter-spacing:.09em;color:var(--putih)}
  #sisi .sub{font-size:10px;color:var(--redup);margin-bottom:4px}
  #sisi .bab{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
    color:#465061;margin:12px 0 2px;font-weight:600}

  /* ── layar lebar: kendali pindah ke sisi kiri ────────────────────────
     Di HP, saringan dan kotak cari harus di bawah supaya terjangkau jempol.
     Di layar lebar itu justru salah: mereka jadi bilah panjang yang jauh
     dari graf. Jadi keduanya dipindah ke panel kiri, dan cincin reaktor
     digeser ke kanan supaya tengah layar sepenuhnya milik graf. */
  @media (min-width: 1000px) {
    #sisi { display: flex !important; }

    header { left: 268px; padding: 20px 24px 14px; }
    h1 { font-size: 16px; }

    #cincin { top: 50%; left: auto; right: 26px;
              transform: translateY(-50%); width: 150px; height: 150px; }
    #nama { top: 50%; left: auto; right: 26px; width: 150px;
            transform: translateY(-50%); font-size: 10px; }
    #pil { top: calc(50% + 96px); left: auto; right: 26px; width: 150px;
           flex-direction: column; align-items: center; gap: 6px; padding: 0; }

    /* saringan & kotak cari pindah ke panel kiri */
    #saring { position: static; flex-direction: column; overflow: visible;
              padding: 0; gap: 5px; }
    .cip { width: 100%; justify-content: flex-start; padding: 7px 11px; font-size: 12px; }
    .cip b { margin-left: auto; }
    #bawah { position: static; background: 0; border: 0; padding: 0 0 14px;
             backdrop-filter: none; }
    #tanya { font-size: 13px; padding: 10px 13px; }
    .bulat { width: 38px; height: 38px; font-size: 16px; }

    #gelembung { left: 292px; right: 220px; bottom: 26px; font-size: 14.5px; }

    /* panel simpul jadi laci kanan, tidak menutupi graf */
    #panel { left: auto; right: 0; top: 0; bottom: 0; width: 400px;
             border-radius: 0; border-top: 0; border-left: 1px solid var(--garis);
             transform: translateX(101%); padding: 26px 26px 34px; max-height: none; }
    #panel.buka { transform: translateX(0); }
    .pegangan { display: none; }
  }
</style>
</head>
<body>

<canvas id="papan"></canvas>

<div id="gerbang">
  <div class="kotak">
    <h2>Ocklu Jarvis</h2>
    <p>Peta otak keduamu terkunci. Situs ini publik, jadi datanya disimpan
       terenkripsi — PIN dipakai di HP ini saja.</p>
    <form id="frm"><input id="pin" type="password" autocomplete="current-password"
      placeholder="sandi" enterkeyhint="go"><button id="buka" type="submit">Buka</button></form>
    <div id="pesan"></div>
  </div>
</div>

<div class="sembunyi" id="isi">
  <header>
    <span class="lampu" id="lampu"></span>
    <h1>JARVIS</h1>
    <span class="kecil" id="segar"></span>
  </header>

  <canvas id="cincin" width="236" height="236"></canvas>
  <div id="nama">J.A.R.V.I.S.</div>
  <div id="pil">
    <span class="pil hijau" id="pil-keadaan">siaga</span>
    <span class="pil ungu" id="pil-simpul">—</span>
  </div>

  <div id="gelembung"><div class="siapa">Jarvis</div><div id="gel-isi"></div></div>

  <aside id="sisi">
    <div class="judul">OCKLU JARVIS</div>
    <div class="sub" id="sisi-sub"></div>
    <div class="bab">Cari &amp; tanya</div>
    <div id="tempat-bawah"></div>
    <div class="bab">Saringan</div>
    <div id="tempat-saring"></div>
  </aside>

  <div id="saring"></div>

  <div id="bawah">
    <input id="tanya" placeholder="cari simpul, atau tanya…" enterkeyhint="send"
           autocomplete="off" autocapitalize="off">
    <div class="bulat" id="b-dengar">🎙</div>
    <div class="bulat nyala" id="b-suara">🔊</div>
  </div>
</div>

<div id="tirai"></div>
<div id="panel">
  <div class="pegangan"></div>
  <div id="p-k"></div><div id="p-l"></div><div id="p-d"></div>
  <div id="p-badan"></div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const sisiAktif = () => innerWidth >= 1000;
const SANDI = 'jarvis-hp-pin';
let G = null, N = [], L = [], MATI = new Set(), FOKUS = null, CARI = '';

// ── data ──────────────────────────────────────────────────────────────
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const terkunci = p => !!(p && p.isi && p.garam && p.iv);
async function mentah(){
  const r = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('data belum ada di server');
  return r.json();
}
async function bukaData(sandi){
  const p = await mentah();
  if(!terkunci(p)) return p;
  const bahan = await crypto.subtle.importKey('raw', new TextEncoder().encode(sandi),
    'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(p.garam),iterations:p.putaran||200000,hash:'SHA-256'},
    bahan,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(
    await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},k,b64(p.isi))));
}

// ── graf ──────────────────────────────────────────────────────────────
const papan = $('#papan'), cx = papan.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function ukur(){
  W=innerWidth; H=innerHeight;
  papan.width=W*DPR; papan.height=H*DPR;
  papan.style.width=W+'px'; papan.style.height=H+'px';
  cx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',ukur); ukur();

let yaw=.4, pitch=-.2, zum=1, geser={x:0,y:0}, putar=true;
const SEL=70, kisi=new Map();

function siapkanGraf(d){
  G=d;
  const R=Math.min(W,H)*0.42;
  N = d.node.map((n,i)=>{
    const t=i/Math.max(1,d.node.length-1);
    const fi=Math.acos(1-2*t), th=Math.PI*(1+Math.sqrt(5))*i, j=.35+.65*Math.sqrt(t);
    return {...n, x:R*j*Math.sin(fi)*Math.cos(th), y:R*j*Math.sin(fi)*Math.sin(th),
            z:R*j*Math.cos(fi), vx:0,vy:0,vz:0, r:1.8+Math.sqrt(n.d)*1.05,
            sx:0,sy:0,sp:1, dekat:new Set()};
  });
  const peta = new Map(N.map(n=>[n.i,n]));
  L = d.link.map(l=>({a:peta.get(l.a),b:peta.get(l.b)})).filter(l=>l.a&&l.b);
  L.forEach(l=>{ l.a.dekat.add(l.b.i); l.b.dekat.add(l.a.i); });
}

function langkah(dt){
  if(!N.length) return;
  kisi.clear();
  for(const a of N){
    const k=((a.x/SEL)|0)+','+((a.y/SEL)|0)+','+((a.z/SEL)|0);
    let b=kisi.get(k); if(!b) kisi.set(k,b=[]);
    if(b.length<6) b.push(a);
  }
  for(const a of N){
    let fx=0,fy=0,fz=0;
    const ax=(a.x/SEL)|0, ay=(a.y/SEL)|0, az=(a.z/SEL)|0;
    for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)for(let k=-1;k<=1;k++){
      const b=kisi.get((ax+i)+','+(ay+j)+','+(az+k)); if(!b) continue;
      for(const o of b){
        if(o===a) continue;
        let dx=a.x-o.x,dy=a.y-o.y,dz=a.z-o.z, d2=dx*dx+dy*dy+dz*dz;
        if(d2<.01){dx=Math.random()-.5;dy=Math.random()-.5;d2=1;}
        if(d2>SEL*SEL*4) continue;
        const f=1200/d2, d=Math.sqrt(d2);
        fx+=dx/d*f; fy+=dy/d*f; fz+=dz/d*f;
      }
    }
    a.vx+=fx*dt; a.vy+=fy*dt; a.vz+=fz*dt;
  }
  for(const l of L){
    const a=l.a,b=l.b;
    let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;
    const d=Math.hypot(dx,dy,dz)||.001, f=(d-56)*.0055;
    dx/=d;dy/=d;dz/=d;
    a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f; b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f;
  }
  for(const a of N){
    a.vx-=a.x*.0016; a.vy-=a.y*.0016; a.vz-=a.z*.0016;
    a.vx*=.86; a.vy*=.86; a.vz*=.86;
    const v=Math.hypot(a.vx,a.vy,a.vz); if(v>14){const s=14/v;a.vx*=s;a.vy*=s;a.vz*=s;}
    a.x+=a.vx; a.y+=a.vy; a.z+=a.vz;
  }
}

const warnaA=(hex,a)=>{const n=parseInt((hex||'#889').slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};

function terang(n){
  if(CARI) return n.l.toLowerCase().includes(CARI) ? 1 : .06;
  if(FOKUS) return n.i===FOKUS ? 1 : (N.find(x=>x.i===FOKUS)?.dekat.has(n.i) ? .9 : .05);
  return 1;
}

function gambarGraf(){
  cx.clearRect(0,0,W,H);
  if(!N.length) return;
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  // Skala ikut ukuran jendela. Tanpa ini graf tetap sebesar layar HP walau
  // jendelanya dilebarkan — kelihatan seperti gumpalan kecil di tengah.
  const auto=Math.min(W,H)/760;
  const ox=(sisiAktif()? (W+252)/2 : W/2)+geser.x, oy=H*0.52+geser.y, F=680;
  const Z=zum*Math.max(.75,auto);
  for(const n of N){
    const x1=n.x*cy-n.z*sy, z1=n.x*sy+n.z*cy;
    const y1=n.y*cp-z1*sp, z2=n.y*sp+z1*cp;
    const p=F/(F+z2+300); n.sp=p>.05?p:.05;
    n.sx=ox+x1*n.sp*Z; n.sy=oy+y1*n.sp*Z; n.sz=z2;
    n.tampak=!MATI.has(n.k);
  }
  const urut=N.filter(n=>n.tampak).sort((a,b)=>b.sz-a.sz);

  cx.lineWidth=.55;
  for(const l of L){
    if(!l.a.tampak||!l.b.tampak) continue;
    const tr=Math.min(terang(l.a),terang(l.b)); if(tr<.1) continue;
    cx.strokeStyle=`rgba(88,190,150,${(.04+((l.a.sp+l.b.sp)/2)*.07)*tr})`;
    cx.beginPath(); cx.moveTo(l.a.sx,l.a.sy); cx.lineTo(l.b.sx,l.b.sy); cx.stroke();
  }
  for(const n of urut){
    const tr=terang(n); if(tr<.05) continue;
    const R=n.r*n.sp*Z; if(R<.4) continue;
    const w=G.warna[n.k]||'#8892a0';
    if(n.d>8||n.i===FOKUS){
      cx.fillStyle=warnaA(w,.15*tr);
      cx.beginPath(); cx.arc(n.sx,n.sy,R*2.3,0,6.2832); cx.fill();
    }
    cx.fillStyle=warnaA(w,(.42+n.sp*.55)*tr);
    cx.beginPath(); cx.arc(n.sx,n.sy,R,0,6.2832); cx.fill();
  }
  cx.textAlign='center'; cx.textBaseline='middle';
  for(const n of urut){
    const tr=terang(n);
    if(tr<.5 || n.sp<.6) continue;
    if(!(FOKUS||CARI) && n.d<16) continue;
    const uk=Math.max(8,Math.min(12,6+n.d*.08))*(.75+n.sp*.4);
    cx.font=`500 ${uk.toFixed(1)}px -apple-system,sans-serif`;
    cx.fillStyle=`rgba(214,224,236,${.35+n.sp*.5})`;
    cx.fillText(n.l, n.sx, n.sy+n.r*n.sp*Z+uk*.95);
  }
}

// ── cincin ────────────────────────────────────────────────────────────
const cin=$('#cincin'), cc=cin.getContext('2d');
let keadaan='siaga';
function gambarCincin(t){
  cc.clearRect(0,0,236,236);
  const c=118, sibuk = keadaan==='berpikir'?2.4 : keadaan==='bicara'?1.9 : 1;
  const P=[150,110,255], K=[190,150,255];
  const lapis=[{r:104,w:1.8,a:.2,k:.22,p:5},{r:95,w:5,a:.5,k:-.36,p:3},
               {r:85,w:2,a:.4,k:.55,p:7},{r:74,w:7,a:.28,k:-.2,p:2},
               {r:62,w:1.8,a:.5,k:.78,p:4},{r:52,w:4,a:.4,k:-.52,p:6}];
  for(const l of lapis) for(let i=0;i<l.p;i++){
    const pj=(1.05/l.p)*(.45+.5*Math.abs(Math.sin(t*.0004+i*1.7)));
    const m=t*.001*l.k*sibuk+(i*6.2832)/l.p;
    cc.beginPath(); cc.arc(c,c,l.r,m,m+pj*3.1416);
    cc.strokeStyle=`rgba(${P[0]},${P[1]},${P[2]},${l.a})`;
    cc.lineWidth=l.w; cc.lineCap='round'; cc.stroke();
  }
  const d=.5+.5*Math.sin(t*.0022*sibuk), R=34+d*7*sibuk;
  const g=cc.createRadialGradient(c,c,0,c,c,R*1.7);
  g.addColorStop(0,`rgba(${K[0]},${K[1]},${K[2]},${.5+d*.3})`);
  g.addColorStop(.45,`rgba(${P[0]},${P[1]},${P[2]},.22)`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  cc.fillStyle=g; cc.beginPath(); cc.arc(c,c,R*1.7,0,6.2832); cc.fill();
  cc.strokeStyle=`rgba(${K[0]},${K[1]},${K[2]},.55)`; cc.lineWidth=1.3;
  cc.beginPath(); cc.arc(c,c,39,0,6.2832); cc.stroke();
}

let lalu=0;
function bingkai(t){
  const dt=Math.min(2,(t-lalu)/16.67||1); lalu=t;
  if(putar && !seret) yaw+=.0004*dt;
  langkah(dt); gambarGraf(); gambarCincin(t);
  requestAnimationFrame(bingkai);
}

// ── sentuh ────────────────────────────────────────────────────────────
let seret=false, sx0=0, sy0=0, jarak0=0, geserAwal=false;
papan.addEventListener('touchstart',e=>{
  if(e.touches.length===1){ seret=true; geserAwal=false;
    sx0=e.touches[0].clientX; sy0=e.touches[0].clientY; }
  else if(e.touches.length===2){
    jarak0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                      e.touches[0].clientY-e.touches[1].clientY); }
},{passive:true});
papan.addEventListener('touchmove',e=>{
  if(e.touches.length===2 && jarak0){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                       e.touches[0].clientY-e.touches[1].clientY);
    zum=Math.max(.3,Math.min(5,zum*(d/jarak0))); jarak0=d; return;
  }
  if(!seret) return;
  const dx=e.touches[0].clientX-sx0, dy=e.touches[0].clientY-sy0;
  if(Math.hypot(dx,dy)>6) geserAwal=true;
  yaw+=dx*.006; pitch=Math.max(-1.5,Math.min(1.5,pitch+dy*.006));
  sx0=e.touches[0].clientX; sy0=e.touches[0].clientY;
},{passive:true});
papan.addEventListener('touchend',e=>{
  seret=false; jarak0=0;
  if(geserAwal) return;                        // geser, bukan ketuk
  const t=e.changedTouches[0];
  const n=dekat(t.clientX,t.clientY);
  if(n) bukaSimpul(n); else { FOKUS=null; tutup(); }
},{passive:true});
papan.addEventListener('click',e=>{ const n=dekat(e.clientX,e.clientY); if(n) bukaSimpul(n); });

function dekat(mx,my,rad=22){
  let baik=null, j=rad*rad;
  for(const n of N){ if(!n.tampak) continue;
    const d=(n.sx-mx)**2+(n.sy-my)**2; if(d<j){j=d;baik=n;} }
  return baik;
}

// ── panel simpul ──────────────────────────────────────────────────────
function tutup(){ $('#panel').classList.remove('buka'); $('#tirai').classList.remove('buka'); }
$('#tirai').onclick=tutup;
const NAMA_K={Router:'Router',Wiki:'Wiki',Concepts:'Gagasan',Suites:'Rumpun',
  Skills:'Keahlian',Tools:'Alat',Worlds:'Dunia',Notes:'Catatan',Files:'Berkas'};

function bukaSimpul(n){
  FOKUS=n.i;
  $('#p-k').textContent=NAMA_K[n.k]||n.k;
  $('#p-k').style.color=G.warna[n.k]||'#889';
  $('#p-l').textContent=n.l;
  $('#p-d').textContent=`${n.d} sambungan`;
  const tt=[...n.dekat].map(i=>N.find(x=>x.i===i)).filter(Boolean)
    .sort((a,b)=>b.d-a.d).slice(0,14);
  $('#p-badan').innerHTML = tt.length
    ? `<div class="p-bab">Tersambung ke</div><div class="tetangga">` +
      tt.map(x=>`<span class="tt" data-i="${x.i}">${esc(x.l)}</span>`).join('') + `</div>`
    : `<div class="p-bab">Tersambung ke</div><div style="color:var(--redup);font-size:13px">
       Tidak ada di potongan yang dibawa ke HP.</div>`;
  $('#panel').querySelectorAll('.tt').forEach(el=>el.onclick=()=>{
    const x=N.find(y=>y.i===+el.dataset.i); if(x) bukaSimpul(x);
  });
  $('#panel').classList.add('buka'); $('#tirai').classList.add('buka');
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── bicara ────────────────────────────────────────────────────────────
let suara=true, jamGel=null;
function pil(k){ keadaan=k;
  $('#pil-keadaan').textContent = {siaga:'siaga',berpikir:'berpikir',bicara:'bicara'}[k]||k; }
function bilang(teks, diamkan){
  $('#gel-isi').textContent=teks;
  $('#gelembung').classList.add('tampil');
  clearTimeout(jamGel);
  jamGel=setTimeout(()=>$('#gelembung').classList.remove('tampil'),
    Math.max(6000,teks.length*62));
  if(diamkan || !suara || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(teks);
    const v=speechSynthesis.getVoices();
    const p=v.find(x=>/id[-_]ID/i.test(x.lang)) || v.find(x=>/Daniel/i.test(x.name));
    if(p){u.voice=p;u.lang=p.lang;}
    u.rate=1; u.pitch=.94;
    u.onstart=()=>pil('bicara'); u.onend=()=>pil('siaga');
    speechSynthesis.speak(u);
  }catch(e){}
}

// ── perintah lokal ────────────────────────────────────────────────────
// Tanpa laptop tidak ada otak LLM di sini. Yang bisa dijawab dijawab dari
// peta; yang butuh otak dikatakan terus terang, bukan dikarang.
function jawab(teksAsli){
  const t=teksAsli.toLowerCase().trim();
  if(!t) return;

  if(/\b(berapa|jumlah)\b.*\b(simpul|node|berkas|file)\b/.test(t)){
    const h=G.hitung;
    bilang(`${G.penuh_node} simpul dan ${G.penuh_link} sambungan di laptop, Tuan. ` +
      `Yang saya bawa ke HP ${G.tampil_node} yang paling tersambung: ` +
      `${h.Files||0} berkas, ${h.Notes||0} catatan, ${h.Suites||0} rumpun.`);
    return;
  }
  if(/\b(otak|model)\b/.test(t) && /\b(apa|mana|pakai|pake|hidup)\b/.test(t)){
    bilang('Di HP saya tidak punya otak, Tuan — cuma peta dan ingatan. ' +
      'Untuk berpikir saya butuh laptop menyala. Yang tetap jalan tanpa laptop ' +
      'itu Ocklu-9099: dia bekerja di server GitHub dan melapor lewat Telegram.');
    return;
  }

  // pencarian simpul — inti kegunaan versi HP
  let kata=t.replace(/^(jarvis[,\s]+)?(tolong\s+|coba\s+)?(buka|bukakan|tampilkan|cari|carikan|tarik|pusatkan|mana|di\s?mana)\s+/,'')
             .replace(/^(berkas|file|folder|simpul|node|semua)\s+/,'')
             .replace(/^(yang|tentang|soal|terkait|punya|milik)\s+/,'')
             .trim().replace(/[?.!]+$/,'');
  if(!kata) kata=t;

  let cocok=N.filter(n=>n.l.toLowerCase().includes(kata));
  if(!cocok.length){
    const bagian=kata.match(/\w{4,}/g)||[];
    cocok=N.filter(n=>bagian.some(w=>n.l.toLowerCase().includes(w)));
  }
  if(cocok.length){
    cocok.sort((a,b)=>b.d-a.d);
    const u=cocok[0], lain=cocok.length-1;
    CARI=''; $('#tanya').value='';
    bukaSimpul(u);
    bilang(`Ketemu, Tuan: ${u.l} — ${NAMA_K[u.k]||u.k}, ${u.d} sambungan` +
      (lain?`, dan ${lain} simpul lain juga cocok.`:'.'));
  } else {
    bilang(`Tidak ada simpul yang cocok dengan "${kata}", Tuan. ` +
      `Saya tidak akan mengarang berkas yang tidak ada. ` +
      `Mungkin dia tidak ikut ke HP — yang saya bawa ${G.tampil_node} dari ${G.penuh_node} simpul.`);
  }
}

$('#tanya').addEventListener('input',e=>{ CARI=e.target.value.trim().toLowerCase(); });
$('#tanya').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ const v=e.target.value; CARI=''; e.target.blur(); jawab(v); }
});

// ── dengar ────────────────────────────────────────────────────────────
let kenal=null, dengar=false;
$('#b-dengar').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ bilang('Peramban ini tidak punya pengenal suara, Tuan. ' +
    'Di iPhone hanya Safari terbaru yang bisa; di Android pakai Chrome.',true); return; }
  if(dengar){ dengar=false; $('#b-dengar').classList.remove('nyala');
    try{kenal.stop();}catch(e){} bilang('Bebas tangan dimatikan.',true); return; }
  kenal=new SR(); kenal.lang='id-ID'; kenal.continuous=false; kenal.interimResults=false;
  kenal.onresult=ev=>{
    const t=ev.results[ev.results.length-1][0].transcript.trim();
    if(t) jawab(t.replace(/^(jarvis|jarpis|servis)[,\s]*/i,''));
  };
  kenal.onerror=ev=>{ if(ev.error==='not-allowed'){
    bilang('Izin mikrofon ditolak, Tuan.',true);
    dengar=false; $('#b-dengar').classList.remove('nyala'); } };
  kenal.onend=()=>{ if(dengar){ try{kenal.start();}catch(e){} } };
  try{kenal.start();}catch(e){}
  dengar=true; $('#b-dengar').classList.add('nyala');
  bilang('Bebas tangan menyala, Tuan. Sebut nama berkas yang Anda cari.');
};
$('#b-suara').onclick=()=>{
  suara=!suara; $('#b-suara').classList.toggle('nyala',suara);
  if(!suara && window.speechSynthesis) speechSynthesis.cancel();
  bilang(suara?'Suara saya hidup kembali.':'Saya bungkam — layar saja.',!suara);
};

// ── gambar awal ───────────────────────────────────────────────────────
function mulai(d){
  siapkanGraf(d);
  $('#saring').innerHTML=Object.keys(d.warna).map(k=>
    `<span class="cip" data-k="${k}"><i style="background:${d.warna[k]}"></i>${NAMA_K[k]||k}
     <b style="color:#3f4854;font-weight:600">${d.hitung[k]||0}</b></span>`).join('');
  $('#saring').querySelectorAll('.cip').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k;
    if(MATI.has(k)){MATI.delete(k);el.classList.remove('mati');}
    else{MATI.add(k);el.classList.add('mati');}
  });

  $('#pil-simpul').textContent=`${d.tampil_node} dari ${d.penuh_node} simpul`;
  const seg=new Date(d.dibuat*1000), umur=(Date.now()-seg.getTime())/86400000;
  $('#segar').textContent=seg.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});
  $('#lampu').className='lampu'+(umur>3?' tua':'');

  $('#gerbang').classList.add('sembunyi');
  $('#isi').classList.remove('sembunyi');
  requestAnimationFrame(bingkai);
  setTimeout(()=>bilang(umur>3
    ? `Selamat datang, Tuan. Peta ini dari ${Math.round(umur)} hari lalu — ` +
      `nyalakan laptop untuk menyegarkannya.`
    : 'Selamat datang kembali, Tuan. Peta otak kedua Anda siap dibaca.'),700);
}

async function coba(s,diam){
  try{ mulai(await bukaData(s)); localStorage.setItem(SANDI,s); return true; }
  catch(e){
    if(!diam) $('#pesan').textContent=/decrypt|operation/i.test(String(e.message||e))
      ? 'Sandi salah.' : 'Gagal memuat: '+(e.message||e);
    localStorage.removeItem(SANDI); return false;
  }
}
$('#frm').onsubmit=async e=>{
  e.preventDefault(); const s=$('#pin').value.trim(); if(!s) return;
  $('#buka').disabled=true; $('#pesan').textContent='membuka…';
  await coba(s,false); $('#buka').disabled=false;
};
(async()=>{
  try{ const p=await mentah(); if(!terkunci(p)){ mulai(p); return; } }
  catch(e){ $('#pesan').textContent='Gagal memuat: '+(e.message||e); }
  const s=localStorage.getItem(SANDI);
  if(s && await coba(s,true)) return;
  $('#pin').focus();
})();

// Di layar lebar, saringan & kotak cari dipindah ke panel kiri. Elemennya
// SAMA, cuma berpindah induk — jadi semua pendengar tetap menempel.
function tataLetak(){
  const lebar = innerWidth >= 1000;
  const saring = $('#saring'), bawah = $('#bawah');
  if(lebar){
    $('#tempat-bawah').appendChild(bawah);
    $('#tempat-saring').appendChild(saring);
    if(G) $('#sisi-sub').textContent = `${G.tampil_node} dari ${G.penuh_node} simpul`;
  } else if(bawah.parentElement !== document.body){
    document.body.appendChild(saring);
    document.body.appendChild(bawah);
  }
}
addEventListener('resize', tataLetak);
const _mulai = mulai;
mulai = d => { _mulai(d); tataLetak(); };

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
