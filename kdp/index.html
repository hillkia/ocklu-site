<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ocklu KDP</title>
<style>
:root{--bg:#0d1117;--kartu:#161b22;--garis:#232a33;--teks:#e6edf3;--redup:#8b949e;
--hijau:#3fb950;--merah:#f85149;--kuning:#d29922;--biru:#58a6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--teks);padding-bottom:60px;
font:15px/1.6 -apple-system,system-ui,"SF Pro Text",Roboto,sans-serif}
header{padding:11px 14px;border-bottom:1px solid var(--garis);position:sticky;top:0;
background:rgba(13,17,23,.96);backdrop-filter:blur(10px);z-index:9}
.atas{display:flex;gap:8px;align-items:center}
h1{font-size:14px;margin:0;letter-spacing:.4px}
.pill{padding:3px 9px;border-radius:999px;font-size:11px;border:1px solid var(--garis);white-space:nowrap}
.ok{color:var(--hijau);border-color:#1c4028}.bad{color:var(--merah);border-color:#4a1f1f}
.warn{color:var(--kuning);border-color:#4a3a12}
.tab{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tab button{background:#0b0f14;border:1px solid var(--garis);color:var(--redup);
padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.tab button.aktif{background:#1f2937;color:var(--teks)}
main{padding:12px;max-width:760px;margin:0 auto}
.kartu{background:var(--kartu);border:1px solid var(--garis);border-radius:14px;padding:14px;margin-bottom:12px}
.kartu h2{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--redup)}
button,a.tombol{background:#1f6feb;color:#fff;border:0;padding:11px 15px;border-radius:10px;
font-size:14px;text-decoration:none;display:inline-block;text-align:center;cursor:pointer}
a.sepi,button.sepi{background:#21262d;border:1px solid var(--garis);color:var(--teks)}
input{background:#0b0f14;color:var(--teks);border:1px solid var(--garis);border-radius:10px;padding:12px;font-size:16px;width:100%}
.baris{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--garis);vertical-align:top}
th{color:var(--redup);font-size:10px;text-transform:uppercase}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.est{color:var(--kuning)}
.gulir{overflow-x:auto;-webkit-overflow-scrolling:touch}
.baca{font-size:16.5px;line-height:1.8}
.baca h1{font-size:23px;margin:26px 0 4px}
.baca h2{font-size:17px;color:var(--redup);margin:0 0 18px;text-transform:none;letter-spacing:0}
.baca h3{font-size:17.5px;margin:28px 0 6px;color:var(--biru)}
.baca table{margin:12px 0}.baca strong{color:#fff}
.baca hr{border:0;border-top:1px solid var(--garis);margin:20px 0}
.aturan{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--garis)}
.aturan small{color:var(--redup);display:block;font-size:12px}
.log{font-family:ui-monospace,Menlo,monospace;font-size:11px;max-height:60vh;overflow:auto}
.log div{padding:3px 0;border-bottom:1px solid #1a2029;color:var(--redup)}
pre{background:#0b0f14;border:1px solid var(--garis);border-radius:8px;padding:11px;
overflow:auto;font-size:12px;white-space:pre-wrap}
.sampul{width:112px;border-radius:6px;border:1px solid var(--garis)}
.skor{font-size:32px;font-weight:700;line-height:1}
.pusat{max-width:340px;margin:14vh auto;padding:0 18px;text-align:center}
#pesan{position:fixed;left:12px;right:12px;bottom:12px;background:#1f2937;border:1px solid var(--garis);
padding:11px 14px;border-radius:10px;font-size:13px;display:none;z-index:50}
</style></head><body>
<header>
  <div class="atas">
    <h1>OCKLU KDP</h1>
    <span class="pill" id="pWorker">—</span>
    <span style="flex:1"></span>
    <span class="pill" id="pWaktu">—</span>
    <button class="sepi" style="padding:6px 11px;font-size:13px" id="bSegar" onclick="segarkan()">Segarkan</button>
  </div>
  <div class="tab" id="tab" hidden></div>
</header>
<div id="kunci" class="pusat">
  <p style="color:var(--redup);font-size:13px">Dasbor terkunci. Isinya terenkripsi di server;
  kata sandi tidak pernah dikirim ke mana pun.</p>
  <input id="pin" type="password" placeholder="kata sandi" autocomplete="current-password">
  <button style="margin-top:10px;width:100%" onclick="buka()">Buka</button>
  <p id="salah" style="color:var(--merah);font-size:12.5px;display:none">Sandi salah.</p>
</div>
<main id="isi" hidden></main>
<div id="pesan"></div>
<script>
const SIMPAN="ocklu-kdp-pin",AKSI="https://github.com/hillkia/ocklu-kdp/actions/workflows/perintah.yml";
const TABS=[["ringkas","Ringkas"],["naskah","Naskah"],["pasar","Bukti pasar"],["gerbang","Gerbang"],
            ["berkas","Berkas paket"],["buru","Buru topik"],["log","Catatan mesin"]];
let D=null,TAB="ringkas",PILIH=null;

function pesan(s,w){const e=document.getElementById("pesan");e.textContent=s;
  e.style.borderColor=w||"var(--garis)";e.style.display="block";
  clearTimeout(pesan._t);pesan._t=setTimeout(()=>e.style.display="none",5000)}
async function turunkan(sandi,garam){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(sandi),"PBKDF2",false,["deriveBits"]);
  const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:garam,iterations:100000,hash:"SHA-256"},k,384);
  return {kunci:new Uint8Array(b,0,32),iv:new Uint8Array(b,32,16)}}
async function bongkar(b64,sandi){
  const m=Uint8Array.from(atob(b64.replace(/\s+/g,"")),c=>c.charCodeAt(0));
  if(new TextDecoder().decode(m.slice(0,8))!=="Salted__")throw new Error("format");
  const {kunci,iv}=await turunkan(sandi,m.slice(8,16));
  const ck=await crypto.subtle.importKey("raw",kunci,"AES-CBC",false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC",iv},ck,m.slice(16))))}
async function buka(sandi){
  sandi=sandi||document.getElementById("pin").value.trim();if(!sandi)return;
  try{
    D=await bongkar(await (await fetch("keadaan.enc?t="+Date.now())).text(),sandi);
    localStorage.setItem(SIMPAN,sandi);
    document.getElementById("kunci").hidden=true;
    document.getElementById("tab").hidden=false;
    document.getElementById("isi").hidden=false;
    gambar();
  }catch(e){localStorage.removeItem(SIMPAN);document.getElementById("salah").style.display="block"}}
async function segarkan(){
  const b=document.getElementById("bSegar"),s=localStorage.getItem(SIMPAN);
  if(!s)return;
  b.disabled=true;b.textContent="…";
  try{
    D=await bongkar(await (await fetch("keadaan.enc?t="+Date.now())).text(),s);
    gambar();pesan("Diperbarui — data mesin "+D.diperbarui,"var(--hijau)");
  }catch(e){pesan("Gagal menarik data: "+e.message,"var(--merah)")}
  b.disabled=false;b.textContent="Segarkan"}

function md(s){
  const esc=x=>x.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const brs=esc(s).split("\n");let out=[],tbl=[];
  const inl=x=>x.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>")
                .replace(/`(.+?)`/g,"<code>$1</code>").replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>');
  const tutup=()=>{if(!tbl.length)return;
    const sel=tbl.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r));
    out.push('<div class="gulir"><table>'+sel.map((r,i)=>{const c=r.split("|").slice(1,-1);
      return "<tr>"+c.map(x=>`<${i?"td":"th"}>${inl(x.trim())}</${i?"td":"th"}>`).join("")+"</tr>"}).join("")+"</table></div>");
    tbl=[]};
  for(const b of brs){
    if(/^\s*\|/.test(b)){tbl.push(b);continue}
    tutup();
    if(/^#{1,4} /.test(b)){const n=b.match(/^#+/)[0].length;out.push(`<h${n}>${inl(b.slice(n+1))}</h${n}>`)}
    else if(/^---+$/.test(b.trim()))out.push("<hr>");
    else if(/^[-*] /.test(b))out.push("<li>"+inl(b.slice(2))+"</li>");
    else if(b.trim()==="")out.push("");
    else out.push("<p>"+inl(b)+"</p>")}
  tutup();
  return out.join("\n").replace(/(<li>[\s\S]*?<\/li>\n?)+/g,m=>"<ul>"+m+"</ul>")}

const kerja=()=>(D.pekerjaan||[]).find(x=>x.id===PILIH)||(D.pekerjaan||[])[0];
function tabBar(){document.getElementById("tab").innerHTML=TABS.map(([k,n])=>
  `<button class="${TAB===k?'aktif':''}" onclick="TAB='${k}';isi()">${n}</button>`).join("")}

function isi(){
  tabBar();
  const e=document.getElementById("isi"),p=kerja();
  if(TAB==="log"){e.innerHTML='<section class="kartu"><h2>Catatan mesin</h2><div class="log">'+
    (D.log||[]).map(l=>`<div>${l.waktu.slice(5,16)} ${l.pekerjaan?"["+l.pekerjaan+"] ":""}${l.pesan}</div>`).join("")+"</div></section>";return}
  if(TAB==="buru"){
    const b=D.buru||{};
    if(!b.semua||!b.semua.length){e.innerHTML='<section class="kartu"><p style="color:var(--redup)">Belum ada hasil buru topik.</p></section>';return}
    e.innerHTML=`<section class="kartu"><h2>Buru topik — ${b.lolos} lolos dari ${b.diuji}</h2>
      <p style="color:var(--redup);font-size:12px">Tiap kandidat diuji ke halaman Amazon sungguhan. ${b.waktu||""}</p>
      <div class="gulir"><table><tr><th>topik</th><th>vonis</th><th>laris</th><th>celah</th></tr>`+
      b.semua.map(x=>`<tr><td><b>${x.topik}</b>${x.hampir?' <span class="pill warn">hampir</span>':''}
        <br><span style="color:var(--redup);font-size:11px">${(x.masalah||"").slice(0,70)}</span></td>
        <td><span class="pill ${x.boleh?'ok':'bad'}">${x.status}</span></td>
        <td class="n">${x.buku_laris??"—"}</td><td class="n">${x.celah_ulasan??"—"}</td></tr>`).join("")+
      `</table></div>
      <a class="tombol sepi" style="margin-top:12px;display:block" target="_blank" href="${AKSI}">Jalankan buru topik lagi (Actions)</a>
      </section>`;return}
  if(!p){e.innerHTML='<section class="kartu">Belum ada pekerjaan.</section>';return}
  if(TAB==="ringkas"){
    const ab=p.antibubble||{},v=(p.pasar||{}).vonis||{};
    const kurang=(ab.rincian||[]).filter(x=>!x.lulus),
          nunggu=kurang.length===1&&kurang[0].aturan==="disetujui_pemilik";
    e.innerHTML=(D.pekerjaan||[]).map(q=>{
      const a=q.antibubble||{};
      return `<section class="kartu" onclick="PILIH='${q.id}';isi()">
        <div class="baris"><b>${q.id}</b><span style="color:var(--redup)">${q.topik}</span>
          <span style="flex:1"></span>
          <span class="pill ${a.boleh_terbit?'ok':(q.tahap==='berhenti'?'bad':'warn')}">${q.tahap}</span></div>
        ${q.judul?`<div style="margin:8px 0 3px;font-size:16px;font-weight:600">${q.judul.utama}</div>
          <div style="color:var(--redup);font-size:12.5px">${q.judul.sub}</div>`:""}
        <div class="baris" style="margin-top:10px">
          ${q.sampul_gambar?`<img class="sampul" src="${q.sampul_gambar}">`:""}
          <div>${a.skor!=null?`<div class="skor" style="color:${a.boleh_terbit?'var(--hijau)':'var(--kuning)'}">${a.skor}<span style="font-size:12px;color:var(--redup)">/100</span></div>`:""}
          <div style="color:var(--redup);font-size:12px">${q.kata?q.kata.toLocaleString()+" kata":""}${q.sampul?" · sampul "+q.sampul.toUpperCase():""}</div>
          <div style="color:var(--redup);font-size:12px">pasar ${((q.pasar||{}).vonis||{}).status||"—"}</div></div>
        </div>
        ${(q.sebab&&!a.boleh_terbit)?`<p style="color:var(--kuning);font-size:12.5px">${q.sebab}</p>`:""}
      </section>`}).join("")+
      (nunggu?`<a class="tombol" style="display:block" target="_blank" href="${AKSI}">Setujui ${p.id} — buka tombolnya</a>
        <p style="color:var(--redup);font-size:11.5px">Run workflow → perintah <b>setuju</b> → nilai <b>${p.id}</b></p>`:"")+
      `<section class="kartu"><h2>Perintah</h2>
        <p style="color:var(--redup);font-size:12.5px;margin:0 0 10px">${(D.antre||{}).alasan||""}</p>
        <a class="tombol sepi" style="display:block" target="_blank" href="${AKSI}">Buka tombol perintah (tambah / langkah / setuju / paket)</a>
        <p style="color:var(--redup);font-size:11.5px;margin:10px 0 0">Mesin jalan sendiri 08:00 / 14:00 / 20:00 WIB.</p></section>`;
    return}
  if(TAB==="naskah"){
    e.innerHTML=p.naskah?'<section class="kartu"><div class="baca">'+md(p.naskah)+"</div></section>"
      :'<section class="kartu"><p style="color:var(--redup)">Naskah belum ada.</p></section>';return}
  if(TAB==="pasar"){
    const ps=p.pasar||{};
    if(!ps.buku||!ps.buku.length){e.innerHTML='<section class="kartu"><p style="color:var(--redup)">Belum ada riset pasar.</p></section>';return}
    const v=ps.vonis||{};
    e.innerHTML=`<section class="kartu"><h2>Bukti permintaan — Amazon</h2>
      <div class="baris"><span class="pill ${v.boleh_lanjut?'ok':'bad'}">${v.status}</span></div>
      <p style="color:var(--redup);font-size:12px">${(v.alasan||[]).join(" ")}</p>
      <p style="color:var(--redup);font-size:11.5px">Putih = dibaca dari Amazon. <span class="est">Kuning = estimasi</span>.</p>
      <div class="gulir"><table><tr><th>judul</th><th>BSR</th><th>$</th><th>ulasan</th><th class="est">est/bln</th></tr>`+
      ps.buku.map(b=>`<tr><td>${(b.judul||"").slice(0,46)}</td>
        <td class="n">${b.bsr?b.bsr.toLocaleString():"—"}</td>
        <td class="n">${b.harga!=null?b.harga:"—"}</td>
        <td class="n">${b.ulasan!=null?b.ulasan:"—"}</td>
        <td class="n est">${b.est_royalti_bulanan!=null?"$"+b.est_royalti_bulanan:"—"}</td></tr>`).join("")+
      "</table></div></section>";return}
  if(TAB==="gerbang"){
    const ab=p.antibubble;
    if(!ab||!ab.rincian){e.innerHTML='<section class="kartu"><p style="color:var(--redup)">Belum dinilai.</p></section>';return}
    e.innerHTML='<section class="kartu"><h2>Gerbang anti-gelembung</h2>'+
      `<div class="baris"><span class="skor" style="color:${ab.boleh_terbit?'var(--hijau)':'var(--kuning)'}">${ab.skor}</span>
       <span style="color:var(--redup)">/100 · ${ab.boleh_terbit?"BOLEH TERBIT":"DITAHAN"}</span></div>`+
      ab.rincian.map(x=>`<div class="aturan">
        <span style="color:${x.lulus?'var(--hijau)':'var(--merah)'};font-weight:700">${x.lulus?'✓':'✗'}</span>
        <div><b>${x.aturan}</b> <span class="pill">${x.bobot}${x.keras?" keras":""}</span>
        <small>${x.arti}</small><small style="color:var(--biru)">${x.bukti}</small></div></div>`).join("")+"</section>";return}
  if(TAB==="berkas"){
    const b=p.berkas||{};
    const nama=Object.keys(b);
    if(!nama.length){e.innerHTML='<section class="kartu"><p style="color:var(--redup)">Berkas paket belum dirakit.</p></section>';return}
    e.innerHTML='<section class="kartu"><h2>Berkas paket</h2><div class="baris" style="margin-bottom:12px">'+
      nama.map(n=>`<button class="sepi" onclick="lihat('${n}')">${n}</button>`).join("")+
      '</div><div id="berkas"></div></section>';
    lihat(nama[0]);return}
}
function lihat(nama){
  const p=kerja(),e=document.getElementById("berkas");if(!e)return;
  const isi=(p.berkas||{})[nama]||"";
  e.innerHTML=nama.endsWith(".md")?'<div class="baca">'+md(isi)+"</div>":"<pre>"+isi.replace(/</g,"&lt;")+"</pre>"}
function gambar(){
  const a=D.antre||{},w=document.getElementById("pWorker");
  w.className="pill "+((a.aktif&&a.aktif.length)?"warn":"");
  w.textContent=a.alasan?("mesin: "+a.alasan):"—";
  document.getElementById("pWaktu").textContent=(D.diperbarui||"").slice(11);
  isi()}
const s=localStorage.getItem(SIMPAN);if(s)buka(s);
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")buka()});
</script></body></html>
