<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ruang Rapat OCKLU</title>
<style>
:root{--bg:#070b14;--kartu:#0e1526;--garis:#1e2a44;--teks:#e5ecf7;--redup:#8a9bb8;--biru:#38bdf8;--hijau:#34d399;--merah:#f87171;--emas:#facc15;--ungu:#c084fc}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--teks);font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{background:#16223a;border:1px solid var(--garis);border-radius:10px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--biru)}button.utama{background:#0369a1;border-color:#0ea5e9}button.bahaya{border-color:#7f1d1d;color:#fecaca}
button:disabled{opacity:.45;cursor:default}
input,textarea{background:#060a14;border:1px solid var(--garis);border-radius:10px;padding:10px 12px;width:100%}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--garis);flex-wrap:wrap}
header b{color:var(--biru);letter-spacing:.5px}header .judul{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
header .kecil{color:var(--redup);font-size:13px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);min-height:0}
#meja{position:relative;min-height:300px;overflow:hidden}
#mejaBulat{position:absolute;left:50%;top:50%;width:46%;height:34%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(ellipse at 40% 35%,#5b3a1e,#2a1a0c);box-shadow:0 18px 50px #000a,inset 0 2px 0 #8a5a2e;display:flex;align-items:center;justify-content:center;text-align:center;color:#f5d9a8;font-size:13px;padding:10px}
.kursi{position:absolute;transform:translate(-50%,-50%);width:92px;text-align:center;transition:left .4s,top .4s}
.ava{width:58px;height:58px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;border:3px solid transparent;position:relative;background:#1e293b}
.kursi.ai .ava{border-radius:16px}.kursi.ngomong .ava{border-color:var(--hijau);box-shadow:0 0 0 6px #34d39933,0 0 24px #34d39988}
.kursi.mikir .ava::after{content:'…';position:absolute;top:-14px;right:-6px;background:var(--emas);color:#111;border-radius:9px;padding:0 6px;font-size:14px;animation:kedip 1s infinite}
@keyframes kedip{50%{opacity:.3}}
.kursi .nm{font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kursi .tg{font-size:10px;color:var(--redup)}
.kursi .balon{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:190px;background:#f8fafc;color:#0f172a;border-radius:12px;padding:6px 9px;font-size:12px;margin-bottom:6px;display:none;z-index:2}
.kursi.ada-balon .balon{display:block}
#samping{display:flex;flex-direction:column;border-left:1px solid var(--garis);min-height:0}
#notulen{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ps{max-width:92%}.ps .siapa{font-size:12px;color:var(--redup)}.ps .isi{background:var(--kartu);border:1px solid var(--garis);border-radius:12px;padding:7px 10px;white-space:pre-wrap;word-wrap:break-word}
.ps.ai .isi{border-color:#3b2f6b;background:#151230}.ps.ai .siapa{color:var(--ungu)}.ps.aku{align-self:flex-end}.ps.aku .isi{background:#0c2a40;border-color:#0e4d73}
.ps.sistem{align-self:center;text-align:center;max-width:100%}.ps.sistem .isi{background:none;border:none;color:var(--redup);font-size:12px;padding:0}
.ps.ringkas .isi{border-color:var(--emas);background:#1d1a0b}
.ps .otak{font-size:10px;color:#5b6b88}
#cepat{display:flex;gap:6px;overflow-x:auto;padding:6px 12px}#cepat button{white-space:nowrap;font-size:12px;padding:6px 10px;border-radius:999px}
#ketik{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--garis)}
footer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--garis);justify-content:center;flex-wrap:wrap;background:#0a1020}
footer button{min-width:52px}#tahan{background:#3b0764;border-color:#a855f7;user-select:none;-webkit-user-select:none;touch-action:none}
#tahan.rekam{background:#be123c;border-color:#fb7185}
.mati{border-color:var(--merah)!important;color:#fecaca}
.layar{position:fixed;inset:0;background:#030712e6;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto}
.kotak{background:var(--kartu);border:1px solid var(--garis);border-radius:16px;padding:20px;width:min(520px,100%)}
.kotak h1{font-size:20px;margin:0 0 4px}.kotak p{color:var(--redup);margin:6px 0 12px}.kotak .baris{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#111b30;border:1px solid var(--garis);border-radius:999px;padding:5px 10px;margin:3px;font-size:13px;cursor:pointer}
.chip input{width:auto}.daftarR{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.daftarR .r{border:1px solid var(--garis);border-radius:12px;padding:10px}.daftarR .r small{color:var(--redup)}
.tersembunyi{display:none!important}
#pesanTop{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--garis);border-radius:10px;padding:8px 14px;z-index:30;display:none;max-width:90%}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:minmax(230px,38vh) 1fr}#samping{border-left:none;border-top:1px solid var(--garis)}
  .kursi{width:70px}.ava{width:44px;height:44px;font-size:16px}.kursi .balon{width:150px}#mejaBulat{width:50%;height:30%;font-size:11px}footer button{padding:9px 10px}}
</style>
</head>
<body>
<header><b>OCKLU · RUANG RAPAT</b><span class="judul" id="judul">—</span><span class="kecil" id="durasi"></span><span class="kecil" id="jumlah"></span></header>
<main>
  <section id="meja"><div id="mejaBulat">meja rapat</div></section>
  <section id="samping">
    <div id="notulen"></div>
    <div id="cepat"></div>
    <form id="ketik"><input id="masukan" placeholder="ketik… panggil nama pekerja biar dia jawab" autocomplete="off"><button title="kirim">➤</button><button type="button" id="kirimAI" title="kirim & minta pekerja AI jawab">🤖</button></form>
  </section>
</main>
<footer>
  <button id="mic" title="mic">🎙 Mic</button>
  <button id="tahan">✋ Tahan: ngomong ke AI</button>
  <button id="suaraAI" title="suara pekerja AI">🔊 AI</button>
  <button id="undang">🔗 Undang</button>
  <button id="rangkum">📝 Notulen</button>
  <button id="unduh" title="unduh transkrip">⬇</button>
  <button id="akhiri" class="bahaya tersembunyi">⏹ Akhiri</button>
  <button id="keluar" class="bahaya">🚪 Keluar</button>
</footer>
<div id="pesanTop"></div>

<div id="lMasuk" class="layar tersembunyi"><div class="kotak">
  <h1 id="mJudul">Ruang Rapat OCKLU</h1><p id="mAgenda"></p>
  <div id="mPekerja"></div>
  <p style="margin-top:14px">Nama kamu</p><input id="mNama" maxlength="40" placeholder="mis. Budi">
  <div class="baris"><button class="utama" id="mGabung">🎙 Gabung pakai mic</button><button id="mDengar">👂 Gabung tanpa mic</button></div>
  <p id="mInfo" style="font-size:12px">Suara kamu langsung kedengeran peserta lain. Pekerja AI jawab kalau namanya dipanggil atau tombol ✋/🤖 dipakai.</p>
</div></div>

<div id="lDepan" class="layar tersembunyi"><div class="kotak" id="depanIsi"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
// Ruang Rapat OCKLU — manusia + pekerja AI. Suara manusia: WebRTC langsung antar peserta.
// Suara AI: dibacain di tiap HP pakai suara bawaan perangkat. Otak + catatan: Edge Function rapat-api.
// JUJUR: pekerja AI cuma ngomong dari potret HQ waktu rapat dibikin; otak mati = bilang mati.
const API = 'https://njghzieuuopukuagrswu.supabase.co/functions/v1/rapat-api';
const SB = supabase.createClient('https://njghzieuuopukuagrswu.supabase.co', 'sb_publishable_Flgot78lOen26q5dQDV8JA_4MV_0FSn');
const ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }, { urls: 'stun:stun.cloudflare.com:3478' }];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const simpan = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const baca = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const HP = matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad/i.test(navigator.userAgent);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SR_JALAN = !!SR && !HP;          // Android/iOS: dikte bawaan rebutan mic sama WebRTC → pakai rekam-klip
const idKu = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const WARNA = ['#0ea5e9', '#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#14b8a6', '#84cc16', '#ec4899', '#6366f1', '#f97316'];
const warnaDari = (s) => WARNA[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % WARNA.length];
const inisial = (s) => String(s).replace(/^ocklu\s+/i, '').split(/[\s-]+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();

async function api(aksi, isi = {}) {
  const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ aksi, ...isi }) });
  const j = await r.json().catch(() => ({ error: 'jawaban server rusak (' + r.status + ')' }));
  if (!r.ok || j.error) throw new Error(j.error || 'HTTP ' + r.status);
  return j;
}
function kabar(t, ms = 3500) { const e = $('pesanTop'); e.textContent = t; e.style.display = 'block'; clearTimeout(kabar.t); kabar.t = setTimeout(() => e.style.display = 'none', ms); }

// ─── alamat: #<kode> · #pasang=<kode pemilik>&hq=<kode HQ> · #buat=<nama,nama>&hq=… ───
const H = new URLSearchParams(location.hash.slice(1).includes('=') ? location.hash.slice(1) : '');
if (H.get('pasang')) { simpan('rapat-pemilik', H.get('pasang')); if (H.get('hq')) simpan('rapat-hq', H.get('hq')); history.replaceState(null, '', location.pathname + '#dipasang'); }
if (H.get('hq')) simpan('rapat-hq', H.get('hq'));
const PEMILIK = baca('rapat-pemilik') || '';
const KODE = (location.hash.match(/^#([a-z0-9]{16})\b/) || [])[1] || H.get('k') || '';

let RAPAT = null, chan = null, namaKu = baca('rapat-nama') || (PEMILIK ? 'Hillkia' : ''), streamKu = null, micNyala = false;
let suaraAI = baca('rapat-suara-ai') !== '0', mulai = Date.now(), selesai = false;
const peers = new Map();       // id → { pc, audio, nama, tingkat, relay }
const hadir = new Map();       // id → presence
const pesanAda = new Set(), klienAda = new Set();
let idTerakhir = 0, mikir = [];

// ════════ HALAMAN DEPAN (tanpa kode rapat) ════════
async function depan() {
  $('lDepan').classList.remove('tersembunyi');
  const isi = $('depanIsi');
  if (!PEMILIK) {
    isi.innerHTML = `<h1>Ruang Rapat OCKLU</h1><p>Buka link undangan rapat yang dikirim ke kamu (bentuknya <code>ocklu.com/rapat/#…</code>).</p>`;
    return;
  }
  const buatNama = (H.get('buat') || '').split(',').map((s) => s.trim()).filter(Boolean);
  isi.innerHTML = `<h1>🗣 Ruang Rapat — pemilik</h1>${location.hash === '#dipasang' ? '<p style="color:var(--hijau)">✓ Perangkat ini udah jadi perangkat pemilik.</p>' : ''}
    <p>Bikin rapat, kirim linknya, orang yang dapet link bisa langsung ngomong bareng pekerja AI.</p>
    <input id="bJudul" maxlength="120" value="Rapat OCKLU ${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}">
    <textarea id="bAgenda" rows="2" style="margin-top:8px" placeholder="agenda (boleh kosong)"></textarea>
    <p style="margin:10px 0 4px">Pekerja AI yang ikut <span id="bSumber" style="font-size:12px"></span></p><div id="bPekerja">memuat data HQ…</div>
    <div class="baris"><button class="utama" id="bBuat">➕ Bikin rapat & dapet link</button></div><div id="bHasil"></div>
    <h3 style="margin:18px 0 0;font-size:15px">Rapat kamu</h3><div class="daftarR" id="bDaftar">memuat…</div>
    <div class="baris"><button id="bPasang">📱 Pasang HP lain jadi perangkat pemilik</button><button id="bOtak">🧠 Cek otak</button></div><div id="bQR"></div>`;
  const pk = await pekerjaHQ().catch((e) => ({ salah: e.message, daftar: [] }));
  $('bSumber').textContent = pk.sumber ? '· ' + pk.sumber : '';
  $('bPekerja').innerHTML = pk.daftar.length ? pk.daftar.map((p, i) => `<label class="chip"><input type="checkbox" data-i="${i}" ${(buatNama.length ? buatNama.includes(p.nama) : p.aktif) ? 'checked' : ''}> ${esc(p.nama)}</label>`).join('')
    : `<p style="color:var(--merah)">Data HQ gak kebaca${pk.salah ? ' (' + esc(pk.salah) + ')' : ''}. Rapat tetap bisa dibikin tanpa pekerja AI.</p>`;
  $('bBuat').onclick = async () => {
    const dipilih = [...document.querySelectorAll('#bPekerja input:checked')].map((x) => pk.daftar[x.dataset.i]);
    $('bBuat').disabled = true;
    try {
      const r = await api('buat', { pemilik: PEMILIK, judul: $('bJudul').value, agenda: $('bAgenda').value, pekerja: dipilih, fakta: pk.fakta || '', sumber: pk.sumber || '' });
      $('bHasil').innerHTML = kartuLink(r.kode, $('bJudul').value); daftarRapat();
    } catch (e) { $('bHasil').innerHTML = `<p style="color:var(--merah)">${esc(e.message)}</p>`; }
    $('bBuat').disabled = false;
  };
  $('bPasang').onclick = () => {
    const url = `${location.origin}/rapat/#pasang=${encodeURIComponent(PEMILIK)}${baca('rapat-hq') ? '&hq=' + baca('rapat-hq') : ''}`;
    $('bQR').innerHTML = `<p>Scan pakai kamera HP (sekali aja). Jangan kirim ke orang lain — ini kunci pemilik.</p><div id="qr" style="background:#fff;padding:10px;display:inline-block;border-radius:10px"></div>`;
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = () => new QRCode($('qr'), { text: url, width: 220, height: 220 }); document.head.appendChild(s);
  };
  $('bOtak').onclick = async () => { $('bQR').innerHTML = '<p>ngecek…</p>'; try { const r = await api('cek-otak', { pemilik: PEMILIK }); $('bQR').innerHTML = Object.entries(r.otak).map(([k, v]) => `<div><b>${k}</b>: ${esc(v)}</div>`).join(''); } catch (e) { $('bQR').innerHTML = esc(e.message); } };
  daftarRapat();
}
function kartuLink(kode, judul) {
  const link = `${location.origin}/rapat/#${kode}`, wa = `https://wa.me/?text=${encodeURIComponent(`Yuk gabung rapat "${judul}" bareng tim OCKLU (ada pekerja AI-nya juga): ${link}`)}`;
  return `<div class="r" style="border:1px solid var(--hijau);border-radius:12px;padding:10px;margin-top:10px"><b>Link undangan:</b><br><code style="word-break:break-all">${esc(link)}</code>
    <div class="baris"><button data-salin="${esc(link)}">📋 Salin</button><a href="${wa}" target="_blank" rel="noopener"><button>💬 Kirim WA</button></a><a href="#${kode}"><button class="utama">🚪 Masuk rapat</button></a></div></div>`;
}
document.addEventListener('click', async (e) => {
  const s = e.target.closest('[data-salin]'); if (s) { try { await navigator.clipboard.writeText(s.dataset.salin); kabar('Link disalin ✓'); } catch { prompt('Salin link ini:', s.dataset.salin); } }
  const a = e.target.closest('[data-akhiri]'); if (a && confirm('Akhiri rapat ini buat semua peserta?')) { try { await api('akhiri', { pemilik: PEMILIK, kode: a.dataset.akhiri }); daftarRapat(); } catch (x) { kabar(x.message); } }
  const h = e.target.closest('[data-hapus]'); if (h && confirm('Hapus rapat + seluruh catatannya?')) { try { await api('hapus', { pemilik: PEMILIK, kode: h.dataset.hapus }); daftarRapat(); } catch (x) { kabar(x.message); } }
});
async function daftarRapat() {
  try {
    const r = await api('daftar', { pemilik: PEMILIK });
    $('bDaftar').innerHTML = r.rapat.length ? r.rapat.map((x) => `<div class="r"><b>${esc(x.judul)}</b> ${x.aktif ? '<span style="color:var(--hijau)">● aktif</span>' : '<span style="color:var(--redup)">selesai</span>'}<br>
      <small>${new Date(x.dibuat).toLocaleString('id-ID')} · pekerja: ${esc(x.pekerja.join(', ') || '-')} · otak dipakai ${x.ai_dipakai}×</small>
      <div class="baris"><a href="#${x.kode}"><button>${x.aktif ? '🚪 Masuk' : '📜 Notulen'}</button></a>${x.aktif ? `<button data-salin="${location.origin}/rapat/#${x.kode}">📋 Link</button><button class="bahaya" data-akhiri="${x.kode}">⏹ Akhiri</button>` : ''}<button class="bahaya" data-hapus="${x.kode}">🗑</button></div></div>`).join('')
      : '<small>belum ada rapat</small>';
  } catch (e) { $('bDaftar').innerHTML = `<p style="color:var(--merah)">${esc(e.message)}</p>`; }
}
// Pekerja + fakta dari potret OCKLU HQ (ocklu.com/hq/<kode>/data.json) — data yang sama yang tampil di Gedung Teater.
async function pekerjaHQ() {
  const hq = baca('rapat-hq'); if (!hq) throw new Error('kode HQ belum kepasang');
  const d = await (await fetch(`/hq/${hq}/data.json?t=${Date.now()}`)).json();
  const tt = d.teater || {}, hari = tt.hari || 7, umur = Math.round((Date.now() - d.waktu) / 60000);
  const sumber = `potret OCKLU HQ ${new Date(d.waktu).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} (${umur < 90 ? umur + ' mnt lalu' : 'BASI ' + Math.round(umur / 60) + ' jam'})`;
  const projek = new Map((d.projects || []).map((p) => [p.nama, p]));
  const daftar = (tt.pekerja || []).map((p) => {
    const pr = projek.get(p.nama) || {};
    return { nama: p.nama, aktif: Date.now() - p.terakhir < 3 * 864e5, peran: [pr.tipe, pr.ket].filter(Boolean).join(' — ').slice(0, 200) || 'pekerja OCKLU',
      fakta: `${hari} hari terakhir: ${p.keluar} surat keluar, ${p.masuk} masuk, ${p.kerja} commit, ${p.jual} jualan${p.gagal ? ', ' + p.gagal + ' gagal' : ''}; kerja terakhir ${new Date(p.terakhir).toLocaleString('id-ID')}; status server: ${pr.status || 'gak tercatat'}` };
  });
  const r = tt.ringkas || {}, jt = tt.jualTerakhir;
  const n = (s) => (d.projects || []).filter((p) => p.status === s).length;
  const fakta = `Total ${hari} hari: ${r.keluar ?? '?'} surat keluar, ${r.masuk ?? '?'} masuk, ${r.kerja ?? '?'} commit, ${r.jual ?? '?'} jualan. Jualan terakhir tercatat: ${jt ? new Date(jt.t).toLocaleDateString('id-ID') + ' · ' + jt.proyek + ' · ' + jt.judul : 'belum ada'}.
Proyek OCKLU: ${(d.projects || []).length} total, ${n('hidup')} hidup, ${n('mati')} mati.`;
  if (!daftar.some((p) => p.aktif)) daftar.slice(0, 4).forEach((p) => p.aktif = true);
  return { daftar, fakta, sumber };
}

// ════════ MASUK RAPAT ════════
async function bukaRapat() {
  try { RAPAT = await api('info', { kode: KODE }); }
  catch (e) { $('lDepan').classList.remove('tersembunyi'); $('depanIsi').innerHTML = `<h1>Rapat gak ketemu</h1><p>${esc(e.message)}</p>`; return; }
  document.title = RAPAT.judul + ' · Rapat OCKLU'; $('judul').textContent = RAPAT.judul;
  simpan('rapat-aktif', JSON.stringify({ kode: KODE, judul: RAPAT.judul, t: Date.now() }));
  try { window.opener && window.opener.postMessage({ jenis: 'rapat-aktif', kode: KODE, judul: RAPAT.judul }, '*'); } catch {}
  gambarMeja();
  await muatRiwayat();
  if (!RAPAT.aktif) { selesai = true; tandaSelesai(); return; }
  $('mJudul').textContent = RAPAT.judul;
  $('mAgenda').textContent = RAPAT.agenda || (RAPAT.sumber ? 'Data pekerja: ' + RAPAT.sumber : '');
  $('mPekerja').innerHTML = RAPAT.pekerja.map((p) => `<span class="chip">🤖 ${esc(p.nama)}</span>`).join('');
  $('mNama').value = namaKu;
